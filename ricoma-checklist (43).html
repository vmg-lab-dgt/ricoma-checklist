    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f4;
      --bg3: #eeede9;
      --text: #1a1a18;
      --text2: #6b6b67;
      --text3: #a0a09c;
      --border: rgba(0,0,0,0.12);

      --radius: 8px;
      --radius-lg: 12px;

    @media (prefers-color-scheme: dark) {
      :root {

        --bg3: #2e2e2b;
        --text: #f0ede8;
        --text2: #a0a09c;

        --danger-bg: #501313;
        --danger: #f09595;
        --warning-bg: #412402;
        --warning: #ef9f27;

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
    #app { max-width: 480px; margin: 0 auto; padding: 1rem; min-height: 100%; }
    input, textarea, select, button { font-family: inherit; font-size: 14px; color: var(--text); }
    input, textarea {
      width: 100%; padding: 10px 12px;
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius); outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--border2); }
    textarea { resize: vertical; }
    button { cursor: pointer; transition: opacity 0.15s; background: transparent; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 14px; }

<script>
// ── AUTENTICAÇÃO ─────────────────────────────────────────
const SESSION_KEY = "ricoma_user_session";
const SESSION_HOURS = 24;
const ADMIN_KEY = "373737"; // senha para funções administrativas

// Built-in users (stored in Firebase, these are defaults)
const DEFAULT_USERS = [
  { id:"u1", name:"Vitor",   role:"admin",     pin:"1234" },
  { id:"u2", name:"Luiz",    role:"mechanic",  pin:"1111" },
  { id:"u3", name:"Iodenir", role:"mechanic",  pin:"2222" },
];

let currentUser = null;
let allUsers = [...DEFAULT_USERS];

function isAuthenticated() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if ((Date.now() - data.ts) > SESSION_HOURS * 3600 * 1000) return false;
    currentUser = data.user;
    return true;
  } catch { return false; }
}

function setAuthenticated(user) {
  currentUser = user;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now(), user }));
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;
  showLogin();
}

async function loadUsers(db) {
  try {
    const snap = await db.collection("users").get();
    if (!snap.empty) {
      allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } else {
      // First run - save default users to Firebase
      for (const u of DEFAULT_USERS) {
        await db.collection("users").doc(u.id).set(u);
      }
    }
  } catch(e) { allUsers = [...DEFAULT_USERS]; }
}

function showLogin() {
  const app = document.getElementById("app");
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const LOGO = isDark ? LOGO_DARK : LOGO_LIGHT;

  function renderLoginScreen(step, selectedUser, errorMsg) {
    if (step === "select") {
      app.innerHTML = `
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--bg);">
  <div style="width:100%;max-width:340px;">
    <div style="text-align:center;margin-bottom:2rem;">
      <img src="${LOGO}" alt="NS" style="max-width:180px;max-height:90px;margin:0 auto 1rem;object-fit:contain;" />
      <p style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;">Assistência Técnica · RICOMA</p>
    </div>
    <p style="font-size:16px;font-weight:600;margin-bottom:4px;">Quem é você?</p>
    <p style="font-size:13px;color:var(--text2);margin-bottom:1.25rem;">Selecione seu perfil para continuar.</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${allUsers.map(u => `
      <button class="user-select-btn" data-uid="${u.id}" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-lg);background:var(--bg);border:0.5px solid var(--border);cursor:pointer;text-align:left;width:100%;transition:border-color 0.15s;">
        <div style="width:42px;height:42px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--info);flex-shrink:0;">${u.name[0]}</div>
        <div>
          <p style="font-weight:600;font-size:15px;">${u.name}</p>
          <p style="font-size:12px;color:var(--text3);margin-top:1px;">${u.role === 'admin' ? '⚙️ Administrador' : '🔧 Mecânico'}</p>
        </div>
        <span style="margin-left:auto;font-size:18px;color:var(--text3);">›</span>
      </button>`).join("")}
    </div>
  </div>
</div>`;
      document.querySelectorAll(".user-select-btn").forEach(btn => {
        btn.onclick = () => {
          const user = allUsers.find(u => u.id === btn.dataset.uid);
          if (user) renderLoginScreen("pin", user, "");
        };
      });

    } else if (step === "pin") {
      let pinVal = "";
      app.innerHTML = `
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--bg);">
  <div style="width:100%;max-width:320px;">
    <button id="back-to-select" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;margin-bottom:1.5rem;padding:0;">← Voltar</button>
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--info);margin:0 auto 12px;">${selectedUser.name[0]}</div>
      <p style="font-size:18px;font-weight:700;">Olá, ${selectedUser.name}!</p>
      <p style="font-size:13px;color:var(--text2);margin-top:4px;">Digite seu PIN de ${selectedUser.pin?.length||4} dígitos</p>
    </div>
    ${errorMsg ? `<p style="color:var(--danger);font-size:13px;text-align:center;margin-bottom:12px;font-weight:500;">⚠️ ${errorMsg}</p>` : ""}
    <div id="pin-dots" style="display:flex;justify-content:center;gap:12px;margin-bottom:2rem;">
      ${Array(selectedUser.pin?.length||4).fill(0).map((_,i) => `<div id="dot-${i}" style="width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:background 0.15s;"></div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:260px;margin:0 auto;">
      ${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k => k === "" ? "<div></div>" : `
      <button class="pin-key" data-k="${k}" style="padding:18px;border-radius:var(--radius-lg);background:var(--bg2);border:0.5px solid var(--border);font-size:22px;font-weight:600;cursor:pointer;transition:transform 0.1s,background 0.1s;">${k}</button>`).join("")}
    </div>
  </div>
</div>`;

      const maxLen = selectedUser.pin?.length || 4;

      function updateDots() {
        for (let i=0; i<maxLen; i++) {
          const dot = document.getElementById("dot-"+i);
          if (dot) dot.style.background = i < pinVal.length ? "var(--info)" : "transparent";
        }
      }

      function tryLogin() {
        if (pinVal === selectedUser.pin) {
          setAuthenticated(selectedUser);
          initFirebase();
        } else {
          pinVal = "";
          updateDots();
          renderLoginScreen("pin", selectedUser, "PIN incorreto. Tente novamente.");
        }
      }

      document.querySelectorAll(".pin-key").forEach(btn => {
        btn.onclick = () => {
          const k = btn.dataset.k;
          if (k === "⌫") { pinVal = pinVal.slice(0,-1); }
          else if (pinVal.length < maxLen) { pinVal += k; }
          updateDots();
          if (pinVal.length === maxLen) setTimeout(tryLogin, 150);
        };
      });

      document.getElementById("back-to-select").onclick = () => renderLoginScreen("select", null, "");
    }
  }

  renderLoginScreen("select", null, "");
}

async function initFirebase() {
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
  } catch(e) {
    // Already initialized - ignore
  }
  try {
    S.db = firebase.firestore();
  } catch(e) {
    document.getElementById("app").innerHTML =
      '<div style="padding:2rem;color:#a32d2d;"><p style="font-weight:600;margin-bottom:8px;">⚠️ Erro ao conectar ao Firebase</p><p style="font-size:13px;">Verifique sua conexão com a internet e tente novamente.</p></div>';
    return;
  }
  // Load users (never blocks rendering)
  try { await loadUsers(S.db); } catch(e) { allUsers = [...DEFAULT_USERS]; }
  // Render immediately
  S.loading = true;
  render();
  // Load data in background
  try { loadRecords(); } catch(e) {}
  try { loadChamados(); } catch(e) {}
  try { loadKbEntries(); } catch(e) {}
}

async function loadRecords() {
  S.loading = true; render();

  S.loading = false; render();
}

async function getDeviceInfo() {
  const ua = navigator.userAgent;
  const sw = screen.width, sh = screen.height;
  const info = {
    userAgent: ua,
    screenRes: sw + "x" + sh,
    timestamp: new Date().toISOString(),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  };

  // ── BROWSER ──
  if (/EdgA|EdgiOS/.test(ua)) info.browser = "Edge";
  else if (/OPR|OPiOS/.test(ua)) info.browser = "Opera";
  else if (/CriOS/.test(ua)) info.browser = "Chrome (iOS)";
  else if (/Chrome/.test(ua) && !/Chromium/.test(ua)) info.browser = "Chrome";
  else if (/Firefox|FxiOS/.test(ua)) info.browser = "Firefox";
  else if (/Safari/.test(ua)) info.browser = "Safari";
  else info.browser = "Outro";

  // ── ANDROID: extract exact model ──
  if (/Android/.test(ua)) {
    const modelMatch = ua.match(/\(Linux;[^)]*;\s*([^)]+)\)/);
    let model = "Android";
    if (modelMatch) {
      // UA format: "...Build/..." - model is before Build
      const raw = modelMatch[1];
      const buildIdx = raw.indexOf(" Build");
      model = buildIdx > 0 ? raw.substring(0, buildIdx).trim() : raw.split(";").pop().trim();
      // Clean up common prefixes
      model = model.replace(/^Android\s+[\d.]+;\s*/i, "").trim();
    }
    // Brand detection
    const brands = ["Samsung","Motorola","Xiaomi","Redmi","POCO","LG","Sony","Nokia","Huawei","Honor","Realme","OnePlus","Vivo","Oppo","Asus","Lenovo","TCL","Alcatel","ZTE"];
    let brand = "";
    for (const b of brands) {
      if (model.toUpperCase().includes(b.toUpperCase()) || ua.includes(b)) { brand = b; break; }
    }
    info.device = (brand ? brand + " " : "") + model;
    info.os = "Android " + (ua.match(/Android\s+([\d.]+)/)?.[1] || "");
  }

  // ── iPHONE: identify model by screen resolution ──
  else if (/iPhone/.test(ua)) {
    const pxW = sw * (window.devicePixelRatio||1);
    const pxH = sh * (window.devicePixelRatio||1);
    const larger = Math.max(pxW, pxH);
    const smaller = Math.min(pxW, pxH);
    // Map physical pixels to iPhone model
    const iPhoneModels = {
      "2796x1290": "iPhone 14 Pro Max / 15 Pro Max",
      "2556x1179": "iPhone 14 Pro / 15 Pro",
      "2532x1170": "iPhone 12 / 13 / 14",
      "2778x1284": "iPhone 12 Pro Max / 13 Pro Max",
      "2436x1125": "iPhone X / XS / 11 Pro",
      "2688x1242": "iPhone XS Max / 11 Pro Max",
      "1792x828":  "iPhone XR / 11",
      "2340x1080": "iPhone 12 mini / 13 mini",
      "2208x1242": "iPhone 6s+ / 7+ / 8+",
      "1334x750":  "iPhone 6 / 6s / 7 / 8 / SE2",
      "2176x1080": "iPhone SE (3a geração)",
      "1136x640":  "iPhone SE (1a geração)",
    };
    const key = larger + "x" + smaller;
    info.device = "iPhone — " + (iPhoneModels[key] || "modelo " + key + "px");
    info.os = "iOS " + (ua.match(/OS\s+([\d_]+)/)?.[1]?.replace(/_/g,".") || "");
  }

  // ── iPad ──
  else if (/iPad/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1)) {
    info.device = "iPad";
    info.os = "iPadOS";
  }

  // ── DESKTOP ──
  else if (/Windows NT/.test(ua)) {
    const ver = ua.match(/Windows NT ([\d.]+)/)?.[1];
    const winMap = {"10.0":"10/11","6.3":"8.1","6.2":"8","6.1":"7"};
    info.device = "PC Windows " + (winMap[ver] || ver || "");
    info.os = "Windows";
  }
  else if (/Macintosh/.test(ua)) {
    info.device = "Mac";
    info.os = "macOS " + (ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g,".") || "");
  }
  else {
    info.device = "Dispositivo desconhecido";
    info.os = "";
  }

  // ── GPS ──
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, {timeout: 6000})
    );
    info.gps = {
      lat: pos.coords.latitude.toFixed(6),
      lng: pos.coords.longitude.toFixed(6),
      accuracy: Math.round(pos.coords.accuracy) + "m"
    };
  } catch(e) {
    info.gps = null;
  }

  return info;
}

async function saveRecord(rec) {
  S.saving = true; render();
  try {
    const deviceInfo = await getDeviceInfo();
    rec.deviceInfo = deviceInfo;
    await S.db.collection("checklists").doc(rec.id).set(rec);
    await loadRecords();
    S.screen="records"; S.form=nf(); S.step=0; S.saving=false; render();
  } catch(e) {
    S.saving=false;
    alert("Erro ao salvar. Verifique sua conexão e tente novamente.");
    render();
  }
}

async function addReply(chamadoId, reply) {
  const ch = chamados.find(c => c.id === chamadoId);
  if (!ch) return;
  ch.replies = ch.replies || [];
  ch.replies.push(reply);
  // Auto status logic
  if (ch.status === "aberto" && reply.isFactory) ch.status = "andamento";
  if (ch.status === "resolvido" && !reply.reopen) {
    // keep resolved
  } else if (reply.reopen) {
    ch.status = "aberto";
  }
  await saveChamado(ch);
  S.selectedChamado = chamados.find(c => c.id === ch.id);
  render();
}

async function setChamadoStatus(chamadoId, status) {
  const ch = chamados.find(c => c.id === chamadoId);
  if (!ch) return;
  ch.status = status;
  await saveChamado(ch);
  S.selectedChamado = chamados.find(c => c.id === ch.id);
  render();
}

function statusStyle(st) {
  if (st === "aberto")    return { bg:"var(--danger-bg)",    text:"var(--danger)",    label:"● ABERTO" };
  if (st === "andamento") return { bg:"var(--warning-bg)",   text:"var(--warning)",   label:"● EM ANDAMENTO" };
  if (st === "resolvido") return { bg:"var(--success-bg)",   text:"var(--success)",   label:"✓ RESOLVIDO" };
  return { bg:"var(--bg2)", text:"var(--text2)", label:st };
}

function getBlockedSerials() {
  // A serial is "blocked for new preparation" if it already has an instalacao
  const linked = new Set();
  S.records.forEach(r => {
    if (r.type === "instalacao") {
      if (r.serial) linked.add(r.serial.trim().toLowerCase());
      if (r.linkedRecordId) {
        const prep = S.records.find(p => p.id === r.linkedRecordId);
        if (prep && prep.serial) linked.add(prep.serial.trim().toLowerCase());
      }
    }
  });
  return linked;
}

function getExistingPrep(serial) {
  // Returns any preparation record with this serial (for dedup check)
  if (!serial || !serial.trim()) return null;
  const s = serial.trim().toLowerCase();
  return S.records.find(r => r.type === "envio" && r.serial && r.serial.trim().toLowerCase() === s);
}

function getInstalacaoForSerial(serial) {
  if (!serial || !serial.trim()) return null;
  const s = serial.trim().toLowerCase();
  return S.records.find(r => {
    if (r.type !== "instalacao") return false;
    if (r.serial && r.serial.trim().toLowerCase() === s) return true;
    if (r.linkedRecordId) {
      const prep = S.records.find(p => p.id === r.linkedRecordId);
      return prep && prep.serial && prep.serial.trim().toLowerCase() === s;
    }
    return false;
  });
}

function isSerialDuplicatePrep(serial, currentRecordId) {
  // Returns true if another PREPARATION already uses this serial
  if (!serial || !serial.trim()) return false;
  const s = serial.trim().toLowerCase();
  return S.records.some(r =>
    r.type === "envio" &&
    r.serial && r.serial.trim().toLowerCase() === s &&
    r.id !== currentRecordId
  );
}

function isSerialBlocked(serial) {
  if (!serial || !serial.trim()) return false;
  return getBlockedSerials().has(serial.trim().toLowerCase());
}

function generateProtocol(type) {
  if (type !== "instalacao") return null; // Only instalacao gets OS
  const existing = S.records.filter(r => r.type === "instalacao" && r.protocol).length;
  const num = String(existing + 1).padStart(3, "0");
  return "OS-" + num;
}

function submitForm() {
  const f = S.form;
  if (!f.mechanic || !f.model) { alert("Selecione o mecânico e informe o modelo."); return; }
  if (!f.serial || !f.serial.trim()) { alert("O número de série é obrigatório."); return; }

  // Block envio if serial already installed
  if (f.type === "envio" && S.screen !== "edit") {
    const instalRec = getInstalacaoForSerial(f.serial);
    if (instalRec) {
      const osNum = instalRec.protocol || "uma instalação";
      alert("🔒 Número de série bloqueado\n\nEsta máquina já está vinculada à " + osNum + ".\nEla foi vendida e não pode ser preparada novamente.");
      return;
    }
    // Also block if another preparation already uses this serial
    if (isSerialDuplicatePrep(f.serial, S.form.id || "")) {
      const existingPrep = getExistingPrep(f.serial);
      alert("🔒 Número de série duplicado\n\nJá existe uma preparação com o número de série " + f.serial + ".\nCada máquina deve ter um número de série único.");
      return;
    }
  }

  // Block instalacao if serial already installed
  if (f.type === "instalacao" && S.screen !== "edit") {
    const instalExisting = getInstalacaoForSerial(f.serial);
    if (instalExisting) {
      const osNum = instalExisting.protocol || "uma instalação anterior";
      alert("🔒 Máquina já instalada\n\nEste número de série já está vinculado à " + osNum + ".\nNão é possível criar uma nova instalação para esta máquina.");
      return;
    }
  }
  const unc = CHECKLISTS[f.type].items.filter(i => !f.items[i.id]);
  if (unc.length > 0 && !confirm(`${unc.length} item(s) não verificado(s). Salvar assim mesmo?`)) return;
  if (S.screen === "edit") {
    submitEdit();
  } else {
    const protocol = generateProtocol(f.type);
    const newRec = { ...f, id:"r"+Date.now(), date: new Date().toISOString(), protocol };
    // If instalacao links to a prep record, give that prep the same OS
    if (f.type === "instalacao" && f.linkedRecordId && protocol) {
      const prepIdx = S.records.findIndex(r => r.id === f.linkedRecordId);
      if (prepIdx >= 0) {
        const updatedPrep = { ...S.records[prepIdx], protocol };
        S.db.collection("checklists").doc(updatedPrep.id).set(updatedPrep);
      }
    }
    saveRecord(newRec);
  }
}

function checkPass() {
  const p = prompt("Digite a senha de acesso:");

function generateDiff(oldRec, newRec) {
  const changes = [];
  const cl = CHECKLISTS[oldRec.type] || CHECKLISTS[newRec.type];
  if (oldRec.mechanic !== newRec.mechanic) changes.push(`Mecânico: "${oldRec.mechanic}" → "${newRec.mechanic}"`);
  if (oldRec.model !== newRec.model) changes.push(`Modelo: "${oldRec.model}" → "${newRec.model}"`);
  if ((oldRec.serial||"") !== (newRec.serial||"")) changes.push(`N° série: "${oldRec.serial||"—"}" → "${newRec.serial||"—"}"`);
  (cl?.items||[]).forEach(item => {
    const ov = oldRec.items?.[item.id], nv = newRec.items?.[item.id];
    if (ov !== nv) changes.push(`"${item.label}": ${sl(ov)} → ${sl(nv)}`);
    const on = oldRec.notes?.[item.id]||"", nn = newRec.notes?.[item.id]||"";
    if (on !== nn) changes.push(`Obs. "${item.label}": "${on||"—"}" → "${nn||"—"}"`);
  });
  if ((oldRec.observation||"") !== (newRec.observation||"")) changes.push(`Observações gerais alteradas`);
  if ((oldRec.compNote||"") !== (newRec.compNote||"")) changes.push(`Complemento (texto) alterado`);
  const oldPhotos = (oldRec.compPhotos||[]).length, newPhotos = (newRec.compPhotos||[]).length;
  if (oldPhotos !== newPhotos) changes.push(`Fotos complemento: ${oldPhotos} → ${newPhotos}`);
  return changes;
}

function submitEdit() {
  const f = S.form;
  if (!f.mechanic || !f.model) { alert("Selecione o mecânico e informe o modelo."); return; }
  const orig = S.editingRecord;
  const changes = generateDiff(orig, f);
  const histEntry = {
    date: new Date().toISOString(),
    mechanic: f.mechanic,
    changes: changes.length > 0 ? changes : ["Nenhuma alteração detectada"]
  };
  const updated = {
    ...f,
    id: orig.id,
    date: orig.date,
    editHistory: [...(orig.editHistory||[]), histEntry]
  };
  saveRecord(updated);
}

function readFile(file, cb) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 1024, maxH = 1024;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.65));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function si(st) { return st==="ok"?"✓":st==="problema"?"✕":st==="na"?"—":"○"; }

        if(r.protocol) html += '<span style="font-size:10px;font-weight:700;color:var(--info);background:var(--info-bg);padding:1px 7px;border-radius:99px;">'+r.protocol+'</span>';
      else if(r.type==='envio') html += '<span style="font-size:10px;color:var(--text3);background:var(--bg2);padding:1px 7px;border-radius:99px;">Sem OS</span>';
        html += '</div><p style="font-size:12px;color:var(--text2);margin-top:2px;">'+r.mechanic+(r.serial?' · S/N: '+r.serial:'')+'</p></div>';
        html += '<p style="font-size:11px;color:var(--text3);">'+new Date(r.date).toLocaleDateString("pt-BR")+'</p></div>';
        html += '<div style="display:flex;gap:6px;margin-top:6px;">';
        html += '<span class="pill" style="background:var(--success-bg);color:var(--success);">'+ok+' OK</span>';
        if(pr>0) html += '<span class="pill" style="background:var(--danger-bg);color:var(--danger);">'+pr+' prob.</span>';
        html += '</div></button>';
      });
      html += '</div>';
    }
  } else {
    // ── STATS ROW ──
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.5rem;">';
    html += statCard("📅", tc, "Hoje");
    html += statCard("📆", mc, "Este mês");
    html += statCard("📊", recs.length, "Total");
    html += '</div>';

    // ── QUICK ACTIONS ──
    html += '<p style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:10px;">Ações rápidas</p>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem;">';

    html += actionCard("📦", "Nova Preparação", "Máquina para envio", "var(--info-bg)", "var(--info)", "new-envio");
    html += actionCard("🔧", "Nova Instalação", "Checklist no cliente", "var(--success-bg)", "var(--success)", "new-instalacao");
    html += actionCard("📋", "Registros", envioCount+" preparação"+(envioCount!==1?"s":"")+" · "+instalCount+" instalação"+(instalCount!==1?"ões":""), "var(--bg2)", "var(--text2)", "records");
    html += actionCard("⚠️", "Chamados", openChamados>0?openChamados+" aberto"+(openChamados>1?"s":""):"Nenhum aberto", openChamados>0?"var(--danger-bg)":"var(--bg2)", openChamados>0?"var(--danger)":"var(--text2)", "chamados");

    html += '</div>';

    // ── RECENT ACTIVITY ──
    if (recs.length > 0) {
      html += '<p style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:10px;">Atividade recente</p>';
      html += '<div style="display:flex;flex-direction:column;gap:6px;">';
      recs.slice(0,4).forEach(r => {
        const isEnvio = r.type === "envio";
        const icon = isEnvio ? "📦" : "🔧";
        const bgColor = isEnvio ? "var(--info-bg)" : "var(--success-bg)";
        const textColor = isEnvio ? "var(--info)" : "var(--success)";
        html += '<button class="rec-btn" data-rid="'+r.id+'" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--radius-lg);background:var(--bg);border:0.5px solid var(--border);cursor:pointer;">';
        html += '<div style="width:38px;height:38px;border-radius:9px;background:'+bgColor+';display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">'+icon+'</div>';
        html += '<div style="flex:1;min-width:0;">';
        html += '<div style="display:flex;align-items:center;gap:5px;">';
        html += '<p style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+r.model+'</p>';
        if(r.protocol) html += '<span style="font-size:10px;font-weight:700;color:'+textColor+';background:'+bgColor+';padding:1px 6px;border-radius:99px;flex-shrink:0;">'+r.protocol+'</span>';
        html += '</div>';
        html += '<p style="font-size:12px;color:var(--text2);margin-top:1px;">'+r.mechanic+(r.serial?' · '+r.serial:'')+'</p>';
        html += '</div>';
        html += '<p style="font-size:11px;color:var(--text3);flex-shrink:0;">'+new Date(r.date).toLocaleDateString("pt-BR")+'</p>';
        html += '</button>';
      });
      html += '</div>';
    }

    // Logout
    html += '<button onclick="logout()" style="width:100%;padding:10px;border-radius:var(--radius);background:transparent;border:0.5px solid var(--border);color:var(--text3);font-size:13px;margin-top:1.5rem;cursor:pointer;">Sair da conta</button>';
  }

  app.innerHTML = html;

  // Search binds
  const inp = document.getElementById("home-search");
  if (inp) {
    inp.value = S.homeSearch || "";
    inp.oninput = e => {
      S.homeSearch = e.target.value;
      const clr = document.getElementById("home-search-clear");
      if (clr) clr.style.display = e.target.value ? "block" : "none";
      updateHomeResults();
    };
  }
  const clr = document.getElementById("home-search-clear");
  if (clr) clr.onclick = () => { S.homeSearch=""; inp.value=""; clr.style.display="none"; updateHomeResults(); };

  // Action card binds
  document.querySelectorAll(".action-card-btn").forEach(b => b.onclick = () => {
    const action = b.dataset.action;
    if (action === "new-envio") { S.form=nf(); S.form.type="envio"; S.step=0; S.expanded={}; S.screen="new"; render(); }
    else if (action === "new-instalacao") { S.form=nf(); S.form.type="instalacao"; S.step=0; S.expanded={}; S.screen="new"; render(); }
    else if (action === "knowledge") { S.screen="knowledge"; render(); }
    else { S.screen=action; render(); }
  });

  // Alert banner
  document.querySelectorAll(".alert-chamados-btn").forEach(b => {
    b.onclick = () => { S.screen="chamados"; render(); };
  });

  // Rec buttons
  document.querySelectorAll(".rec-btn").forEach(b => b.onclick = () => {
    const r = S.records.find(r=>r.id===b.dataset.rid);
    if (r) { S.selected=r; S.screen="detail"; render(); }
  });
}

function statCard(icon, value, label) {
  return '<div style="background:var(--bg2);border-radius:var(--radius-lg);padding:12px 10px;text-align:center;">' +
    '<p style="font-size:18px;margin-bottom:2px;">'+icon+'</p>' +
    '<p style="font-size:22px;font-weight:700;">'+value+'</p>' +
    '<p style="font-size:11px;color:var(--text3);margin-top:2px;">'+label+'</p>' +
    '</div>';
}

function actionCard(icon, title, subtitle, bg, color, action) {
  return '<button class="action-card-btn" data-action="'+action+'" style="background:'+bg+';border-radius:var(--radius-lg);padding:16px 14px;text-align:left;border:none;cursor:pointer;width:100%;">' +
    '<p style="font-size:26px;margin-bottom:8px;">'+icon+'</p>' +
    '<p style="font-weight:600;font-size:14px;color:'+color+';">'+title+'</p>' +
    '<p style="font-size:12px;color:'+color+';opacity:0.75;margin-top:3px;">'+subtitle+'</p>' +
    '</button>';
}

function navHome(screen) { S.screen=screen; render(); }

function rStep0(app) {
  const w=hdr(app,"Novo checklist","home"), f=S.form;
  w.insertAdjacentHTML("beforeend",`
<div style="display:flex;flex-direction:column;gap:14px;">
  <div>
    <span class="lbl">Tipo de checklist</span>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${Object.entries(CHECKLISTS).map(([k,v])=>`<button class="type-btn" data-type="${k}" style="padding:12px 14px;border-radius:var(--radius);text-align:left;width:100%;font-size:14px;font-weight:${f.type===k?"600":"400"};border:${f.type===k?"2px solid var(--info)":"0.5px solid var(--border)"};background:${f.type===k?"var(--info-bg)":"var(--bg)"};color:${f.type===k?"var(--info)":"var(--text)"};">${v.label}</button>`).join("")}
    </div>
  </div>
  <div>
    <span class="lbl">Mecânico responsável</span>
    <div style="display:flex;gap:6px;">
      ${MECHANICS.map(m=>`<button class="mec-btn" data-mec="${m}" style="flex:1;padding:10px 4px;border-radius:var(--radius);font-size:13px;font-weight:${f.mechanic===m?"600":"400"};border:${f.mechanic===m?"2px solid var(--info)":"0.5px solid var(--border)"};background:${f.mechanic===m?"var(--info-bg)":"var(--bg)"};color:${f.mechanic===m?"var(--info)":"var(--text)"};">${m}</button>`).join("")}
    </div>
  </div>
  <!-- Protocol preview - only for instalacao -->
  ${f.type === 'instalacao' ? `<div style="background:var(--info-bg);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:4px;">
    <span style="font-size:18px;">🔧</span>
    <div>
      <p style="font-size:11px;color:var(--text3);">Ordem de Serviço</p>
      <p style="font-size:16px;font-weight:700;color:var(--info);">${generateProtocol(f.type)}</p>
    </div>
  </div>` : ''}

  <!-- Model + Serial fields -->
  ${(() => {
    const isInstalLinked = f.type==='instalacao' && f.linkedRecordId && f.linkedRecordId !== '__manual__';
    const isInstalManual = f.type==='instalacao' && f.linkedRecordId === '__manual__';

    if (f.type === 'instalacao') {
      // Build vincular section
      const prepRecs = S.records.filter(r => r.type==='envio' && r.serial && !getInstalacaoForSerial(r.serial));
      let html = '<div><span class="lbl">Vincular máquina preparada <span style=\'color:var(--danger);\'>*</span></span>';
      html += '<select id="link-prep-select" style="width:100%;padding:10px 12px;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border);font-size:14px;">';
      html += '<option value="">— Selecionar máquina preparada —</option>';
      prepRecs.forEach(r => { html += '<option value="'+r.id+'"'+(f.linkedRecordId===r.id?' selected':'')+'>'+r.model+' · S/N: '+r.serial+' · '+new Date(r.date).toLocaleDateString("pt-BR")+'</option>'; });
      html += '<option value="__manual__"'+(isInstalManual?' selected':'')+'>Outros — digitar manualmente</option>';
      html += '</select></div>';

      if (isInstalLinked) {
        html += '<div style="background:var(--success-bg);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:8px;"><span style="font-size:16px;">🔒</span><div>';
        html += '<p style="font-size:11px;color:var(--success);font-weight:600;margin-bottom:2px;">Dados puxados da preparação — não editável</p>';
        html += '<p style="font-size:14px;font-weight:600;">'+f.model+'</p>';
        html += '<p style="font-size:13px;color:var(--text2);">S/N: '+f.serial+'</p></div></div>';
      } else if (isInstalManual) {
        html += '<div><span class="lbl">Modelo da máquina</span><input id="inp-model" placeholder="Ex: RICOMA PV1501-10S" value="'+(f.model||'')+'" style="width:100%;" /></div>';
        html += '<div><span class="lbl">Número de série <span style=\'color:var(--danger);\'>*</span></span><input id="inp-serial" placeholder="Obrigatório" value="'+(f.serial||'')+'" style="width:100%;" /><div id="serial-warn-box"></div></div>';
      }
      return html;
    }

    // ENVIO: normal model + serial fields
    let html = '<div><span class="lbl">Modelo da máquina</span>';
    html += '<select id="inp-model-select" style="width:100%;padding:10px 12px;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border);font-size:14px;color:var(--text);margin-bottom:6px;">';
    html += '<option value="">— Selecionar modelo —</option>';
    MACHINE_MODELS.forEach(m => { html += '<option value="RICOMA '+m+'"'+(f.model==="RICOMA "+m?' selected':'')+'>RICOMA '+m+'</option>'; });
    html += '<option value="__outro__"'+(!MACHINE_MODELS.some(m=>f.model==="RICOMA "+m)&&f.model&&f.model!="__outro__"?' selected':'')+'>Outro (digitar manualmente)</option>';
    html += '</select>';
    if (!MACHINE_MODELS.some(m=>f.model==="RICOMA "+m) || f.model==="__outro__") {
      html += '<input id="inp-model" placeholder="Digite o modelo manualmente..." value="'+(f.model==="__outro__"?'':f.model||'')+'" style="width:100%;" />';
    } else {
      html += '<input id="inp-model" type="hidden" value="'+f.model+'" />';
    }
    html += '</div>';
    html += '<div><span class="lbl">Número de série <span style=\'color:var(--danger);\'>*</span></span><input id="inp-serial" placeholder="Obrigatório — Ex: SN-202401-001" value="'+(f.serial||'')+'" style="width:100%;" /><div id="serial-warn-box"></div></div>';
    return html;
  })()}
