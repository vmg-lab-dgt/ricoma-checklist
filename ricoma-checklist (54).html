  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --bg2: #f5f5f4;
      --bg3: #eeede9;
      --text: #1a1a18;
      --text2: #6b6b67;
      --text3: #a0a09c;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --info-bg: #e6f1fb;
      --info: #185fa5;
      --success-bg: #eaf3de;
      --success: #3b6d11;
      --danger-bg: #fcebeb;
      --danger: #a32d2d;
      --warning-bg: #faeeda;
      --warning: #854f0b;
      --radius: 8px;
      --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg2: #262624;
        --bg3: #2e2e2b;
        --text: #f0ede8;
        --text2: #a0a09c;
        --text3: #6b6b67;
        --border: rgba(255,255,255,0.12);
        --border2: rgba(255,255,255,0.22);
        --info-bg: #042c53;
        --info: #85b7eb;
        --success-bg: #173404;
        --success: #97c459;
        --danger-bg: #501313;
        --danger: #f09595;
        --warning-bg: #412402;
        --warning: #ef9f27;
      }
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; }
    #app { max-width: 480px; margin: 0 auto; padding: 1rem; min-height: 100%; }
    input, textarea, select, button { font-family: inherit; font-size: 14px; color: var(--text); }
    input, textarea {
      width: 100%; padding: 10px 12px;
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius); outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--border2); }
    textarea { resize: vertical; }
    button { cursor: pointer; transition: opacity 0.15s; background: transparent; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 14px; }
    button:active { opacity: 0.65; }
    img { display: block; }
    .lbl { display: block; font-size: 11px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; }
    .card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; }
    .surface { background: var(--bg2); border-radius: var(--radius); padding: 10px 12px; }
    @keyframes pageIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .skel { background: linear-gradient(90deg, var(--bg2) 0%, var(--bg3, var(--border)) 50%, var(--bg2) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .bnav-btn { color: var(--text3); transition: color 0.15s; }
    .bnav-btn.active { color: var(--info); }
    .bnav-btn:active { transform: scale(0.9); opacity: 0.7; }
    #bottom-nav { display: none; }
    body.has-nav #app { padding-bottom: 80px; }
    body.has-nav #bottom-nav { display: block; }
    #app > div { animation: pageIn 0.25s cubic-bezier(0.22,1,0.36,1) both; }
    button { transition: transform 0.1s ease, opacity 0.1s ease; }
    button:active { transform: scale(0.97); opacity: 0.8; }
  </style>

<div id="app"><p style="color:var(--text2);padding:2rem;text-align:center;">Conectando ao banco de dados...</p></div>

<div id="sig-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:9998;flex-direction:column;">
  <div style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);">
    <div><p style="font-weight:700;font-size:17px;">✍️ Assinatura do Cliente</p><p style="font-size:12px;color:var(--text3);">Assine com o dedo</p></div>
    <button id="sig-cancel" style="padding:8px 14px;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border);font-size:13px;">Cancelar</button>
  </div>
  <div style="flex:1;position:relative;background:#fff;overflow:hidden;">
    <canvas id="sig-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair;"></canvas>
    <p id="sig-hint" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ccc;font-size:16px;pointer-events:none;">Assine aqui com o dedo</p>
  </div>
  <div style="padding:14px 16px;display:flex;gap:10px;border-top:0.5px solid var(--border);background:var(--bg);">
    <button id="sig-clear" style="flex:1;padding:13px;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border);font-size:14px;">🗑️ Limpar</button>
    <button id="sig-save" style="flex:2;padding:13px;border-radius:var(--radius);background:var(--success-bg);border:none;color:var(--success);font-weight:600;font-size:14px;">✓ Confirmar</button>
  </div>
</div>
<div id="lightbox" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;padding:16px;">
  <button id="lightbox-close" style="position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;cursor:pointer;">✕</button>
  <img id="lightbox-img" src="" alt="" style="max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain;" />
  <div id="lightbox-caption" style="position:fixed;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.7);font-size:13px;"></div>
</div>
<div id="toast-container" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:420px;"></div>
<div id="bottom-nav" style="position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border);padding:6px 0 max(8px,env(safe-area-inset-bottom)) 0;z-index:9990;box-shadow:0 -2px 12px rgba(0,0,0,0.04);">
  <div style="display:grid;grid-template-columns:repeat(5,1fr);max-width:500px;margin:0 auto;">
    <button class="bnav-btn" data-screen="home" style="padding:8px 4px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
      <span style="font-size:20px;line-height:1;">🏠</span><span style="font-size:10px;font-weight:600;">Início</span>
    </button>
    <button class="bnav-btn" data-screen="records" style="padding:8px 4px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
      <span style="font-size:20px;line-height:1;">📋</span><span style="font-size:10px;font-weight:600;">Registros</span>
    </button>
    <button class="bnav-btn" data-screen="knowledge" style="padding:8px 4px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
      <span style="font-size:20px;line-height:1;">📚</span><span style="font-size:10px;font-weight:600;">Conhec.</span>
    </button>
    <button class="bnav-btn" data-screen="chamados" style="padding:8px 4px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;">
      <span style="font-size:20px;line-height:1;">⚠️</span><span style="font-size:10px;font-weight:600;">Chamados</span>
      <span id="bnav-chamados-badge" style="display:none;position:absolute;top:4px;right:calc(50% - 18px);background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;min-width:14px;text-align:center;"></span>
    </button>
    <button class="bnav-btn" data-screen="dashboard" style="padding:8px 4px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
      <span style="font-size:20px;line-height:1;">📊</span><span style="font-size:10px;font-weight:600;">Dashboard</span>
    </button>
  </div>
</div>

let currentUser = null; // { uid, name, email, unit, role, status }

function isAuthenticated() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if ((Date.now() - data.ts) > 24 * 3600 * 1000) return false;
    currentUser = data.user;
    return true;
  } catch { return false; }
}

function setAuthenticated(user) {
  currentUser = user;
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now(), user }));
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;

}

function showLogin() {
  // Ensure Firebase is initialized before any auth calls
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
  } catch(e) {}
  document.body.classList.remove("has-nav");
  const app = document.getElementById("app");
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const LOGO = isDark ? LOGO_DARK : LOGO_LIGHT;

  function showError(msg) {
    const el = document.getElementById("auth-error");
    if (el) { el.textContent = "⚠️ " + msg; el.style.display = "block"; }
  }
  function hideError() {
    const el = document.getElementById("auth-error");
    if (el) el.style.display = "none";
  }
  function setBusy(busy) {
    const btn = document.getElementById("auth-submit");
    if (btn) { btn.disabled = busy; btn.textContent = busy ? "Aguarde..." : btn.dataset.label; }
  }

  function renderScreen(screen) {
    if (screen === "login") {
      app.innerHTML = `

    <div style="text-align:center;margin-bottom:2rem;">
      <img src="${LOGO}" alt="NS" style="max-width:180px;max-height:90px;margin:0 auto 1rem;object-fit:contain;" />

    <h2 style="font-size:22px;font-weight:700;margin-bottom:4px;">Entrar</h2>

    <div id="auth-error" style="display:none;background:var(--danger-bg);color:var(--danger);font-size:13px;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-weight:500;"></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:1.25rem;">

      </div>

// ── ADMIN: APROVAÇÃO DE USUÁRIOS ──────────────────────────
async function loadPendingUsers() {
  try {
    const snap = await firebase.firestore().collection("users").where("status","==","pending").get();
    return snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch { return []; }
}

async function approveUser(uid) {
  await firebase.firestore().collection("users").doc(uid).update({ status:"approved" });
}

async function rejectUser(uid) {
  await firebase.firestore().collection("users").doc(uid).update({ status:"rejected" });
}

function rAdminUsers(app) {
  const w = hdr(app, "Gerenciar Usuários", "home");
  const container = document.createElement("div");
  container.innerHTML = '<p style="color:var(--text2);padding:1rem;text-align:center;">Carregando...</p>';
  w.appendChild(container);

  loadPendingUsers().then(pendingUsers => {
    firebase.firestore().collection("users").orderBy("createdAt","desc").get().then(snap => {
      const allUsers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      let html = '';

      if (pendingUsers.length > 0) {
        html += '<div style="background:var(--warning-bg);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;"><p style="font-weight:600;font-size:13px;color:var(--warning);margin-bottom:10px;">⏳ Aguardando aprovação ('+pendingUsers.length+')</p>';
        pendingUsers.forEach(u => {
          html += '<div style="background:var(--bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;border:0.5px solid var(--border);">';
          html += '<p style="font-weight:600;font-size:14px;">'+u.name+'</p>';

          html += '</div></div>';
        });
        html += '</div>';
      }

      const statusBg    = { approved:'var(--success-bg)', pending:'var(--warning-bg)', rejected:'var(--danger-bg)' };
      const statusLabel = { approved:'Ativo', pending:'Pendente', rejected:'Recusado' };

      allUsers.forEach(u => {
        const sc = statusColor[u.status]||'var(--text3)', sbg = statusBg[u.status]||'var(--bg2)', sl = statusLabel[u.status]||u.status;
        html += '<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-lg);background:var(--bg);border:0.5px solid var(--border);margin-bottom:8px;">';

        html += '<div style="flex:1;min-width:0;"><p style="font-weight:600;font-size:14px;">'+u.name+'</p>';
        html += '<p style="font-size:12px;color:var(--text2);">'+u.email+'</p>';
        html += '<p style="font-size:11px;color:var(--text3);">'+u.unit+(u.role==="admin"?' · Admin':'')+'</p></div>';
        html += '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">';
        html += '<span style="font-size:11px;font-weight:600;color:'+sc+';padding:3px 10px;border-radius:99px;background:'+sbg+';white-space:nowrap;">'+sl+'</span>';

      document.querySelectorAll(".reject-btn").forEach(b => b.onclick = async () => {
        if (!confirm("Recusar acesso de "+b.dataset.name+"?")) return;

      document.querySelectorAll(".delete-user-btn").forEach(b => b.onclick = async () => {

        b.textContent="..."; b.disabled=true;
        try {
          await firebase.firestore().collection("users").doc(b.dataset.uid).delete();
          toast("Usuário removido","success");
          rAdminUsers(document.getElementById("app"));
        } catch(e) { toast("Erro ao remover","error"); b.disabled=false; b.textContent="🗑️"; }
      });
    });
  });
}

// ── FIREBASE ─────────────────────────────────────────────
async function initFirebase() {
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
  } catch(e) {
    // Already initialized — ignore
  }
  try {
    S.db = firebase.firestore();
    S.loading = true;
    render();
    try { loadRecords(); } catch(e) { console.warn("loadRecords:", e); }
    try { loadChamados(); } catch(e) { console.warn("loadChamados:", e); }
    try { loadKbEntries(); } catch(e) { console.warn("loadKbEntries:", e); }
  } catch(e) {
    console.error("initFirebase error:", e);
    // Don't block the app — show login or home even if data load fails
    document.getElementById("app").innerHTML =
      `<div style="padding:2rem;color:var(--danger);">
        <p style="font-weight:500;margin-bottom:8px;">⚠️ Erro ao conectar: ${e.message||e.code||"desconhecido"}</p>
        <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">Verifique sua conexão com a internet e tente novamente.</p>
        <button onclick="initFirebase()" style="padding:12px 20px;border-radius:8px;background:var(--info-bg);border:none;color:var(--info);font-weight:600;cursor:pointer;">🔄 Tentar novamente</button>
      </div>`;
  }
}

async function loadRecords() {
  S.loading = true; render();
  try {
    const snap = await S.db.collection("checklists").orderBy("date","desc").get();
    S.records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { S.records = []; }
  S.loading = false; render();
}

async function getDeviceInfo() {
  const ua = navigator.userAgent;
  const sw = screen.width, sh = screen.height;
  const info = {
    userAgent: ua,
    screenRes: sw + "x" + sh,
    timestamp: new Date().toISOString(),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  };

  // ── BROWSER ──
  if (/EdgA|EdgiOS/.test(ua)) info.browser = "Edge";
  else if (/OPR|OPiOS/.test(ua)) info.browser = "Opera";
  else if (/CriOS/.test(ua)) info.browser = "Chrome (iOS)";
  else if (/Chrome/.test(ua) && !/Chromium/.test(ua)) info.browser = "Chrome";
  else if (/Firefox|FxiOS/.test(ua)) info.browser = "Firefox";
  else if (/Safari/.test(ua)) info.browser = "Safari";
  else info.browser = "Outro";

  // ── ANDROID: extract exact model ──
  if (/Android/.test(ua)) {
    const modelMatch = ua.match(/\(Linux;[^)]*;\s*([^)]+)\)/);
    let model = "Android";
    if (modelMatch) {
      // UA format: "...Build/..." - model is before Build
      const raw = modelMatch[1];
      const buildIdx = raw.indexOf(" Build");
      model = buildIdx > 0 ? raw.substring(0, buildIdx).trim() : raw.split(";").pop().trim();
      // Clean up common prefixes
      model = model.replace(/^Android\s+[\d.]+;\s*/i, "").trim();
    }
    // Brand detection
    const brands = ["Samsung","Motorola","Xiaomi","Redmi","POCO","LG","Sony","Nokia","Huawei","Honor","Realme","OnePlus","Vivo","Oppo","Asus","Lenovo","TCL","Alcatel","ZTE"];
    let brand = "";
    for (const b of brands) {
      if (model.toUpperCase().includes(b.toUpperCase()) || ua.includes(b)) { brand = b; break; }
    }
    info.device = (brand ? brand + " " : "") + model;
    info.os = "Android " + (ua.match(/Android\s+([\d.]+)/)?.[1] || "");
  }

  // ── iPHONE: identify model by screen resolution ──
  else if (/iPhone/.test(ua)) {
    const pxW = sw * (window.devicePixelRatio||1);
    const pxH = sh * (window.devicePixelRatio||1);
    const larger = Math.max(pxW, pxH);
    const smaller = Math.min(pxW, pxH);
    // Map physical pixels to iPhone model
    const iPhoneModels = {
      "2796x1290": "iPhone 14 Pro Max / 15 Pro Max",
      "2556x1179": "iPhone 14 Pro / 15 Pro",
      "2532x1170": "iPhone 12 / 13 / 14",
      "2778x1284": "iPhone 12 Pro Max / 13 Pro Max",
      "2436x1125": "iPhone X / XS / 11 Pro",
      "2688x1242": "iPhone XS Max / 11 Pro Max",
      "1792x828":  "iPhone XR / 11",
      "2340x1080": "iPhone 12 mini / 13 mini",
      "2208x1242": "iPhone 6s+ / 7+ / 8+",
      "1334x750":  "iPhone 6 / 6s / 7 / 8 / SE2",
      "2176x1080": "iPhone SE (3a geração)",
      "1136x640":  "iPhone SE (1a geração)",
    };
    const key = larger + "x" + smaller;
    info.device = "iPhone — " + (iPhoneModels[key] || "modelo " + key + "px");
    info.os = "iOS " + (ua.match(/OS\s+([\d_]+)/)?.[1]?.replace(/_/g,".") || "");
  }

  // ── iPad ──
  else if (/iPad/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1)) {
    info.device = "iPad";
    info.os = "iPadOS";
  }

  // ── DESKTOP ──
  else if (/Windows NT/.test(ua)) {
    const ver = ua.match(/Windows NT ([\d.]+)/)?.[1];
    const winMap = {"10.0":"10/11","6.3":"8.1","6.2":"8","6.1":"7"};
    info.device = "PC Windows " + (winMap[ver] || ver || "");
    info.os = "Windows";
  }
  else if (/Macintosh/.test(ua)) {
    info.device = "Mac";
    info.os = "macOS " + (ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g,".") || "");
  }
  else {
    info.device = "Dispositivo desconhecido";
    info.os = "";
  }

  // ── GPS ──
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, {timeout: 6000})
    );
    info.gps = {
      lat: pos.coords.latitude.toFixed(6),
      lng: pos.coords.longitude.toFixed(6),
      accuracy: Math.round(pos.coords.accuracy) + "m"
    };
  } catch(e) {
    info.gps = null;
  }

  return info;
}

async function saveRecord(rec) {
  S.saving = true; render();
  try {
    const deviceInfo = await getDeviceInfo();
    rec.deviceInfo = deviceInfo;
    await S.db.collection("checklists").doc(rec.id).set(rec);
    await loadRecords();
    S.screen="records"; S.form=nf(); S.step=0; S.saving=false; render();
  } catch(e) {
    S.saving=false;
    alert("Erro ao salvar. Verifique sua conexão e tente novamente.");
    render();
  }
}

function submitForm() {
  const f = S.form;
  if (!f.mechanic || !f.model) { toast("Selecione o mecânico e informe o modelo.","warning"); return; }
  const unc = CHECKLISTS[f.type].items.filter(i => !f.items[i.id]);
  if (unc.length > 0 && !confirm(`${unc.length} item(s) não verificado(s). Salvar assim mesmo?`)) return;
  if (S.screen === "edit") {
    submitEdit();
  } else {
    saveRecord({ ...f, id:"r"+Date.now(), date: new Date().toISOString() });
  }
}

function generateDiff(oldRec, newRec) {
  const changes = [];
  const cl = CHECKLISTS[oldRec.type] || CHECKLISTS[newRec.type];
  if (oldRec.mechanic !== newRec.mechanic) changes.push(`Mecânico: "${oldRec.mechanic}" → "${newRec.mechanic}"`);
  if (oldRec.model !== newRec.model) changes.push(`Modelo: "${oldRec.model}" → "${newRec.model}"`);
  if ((oldRec.serial||"") !== (newRec.serial||"")) changes.push(`N° série: "${oldRec.serial||"—"}" → "${newRec.serial||"—"}"`);
  (cl?.items||[]).forEach(item => {
    const ov = oldRec.items?.[item.id], nv = newRec.items?.[item.id];
    if (ov !== nv) changes.push(`"${item.label}": ${sl(ov)} → ${sl(nv)}`);
    const on = oldRec.notes?.[item.id]||"", nn = newRec.notes?.[item.id]||"";
    if (on !== nn) changes.push(`Obs. "${item.label}": "${on||"—"}" → "${nn||"—"}"`);
  });
  if ((oldRec.observation||"") !== (newRec.observation||"")) changes.push(`Observações gerais alteradas`);
  if ((oldRec.compNote||"") !== (newRec.compNote||"")) changes.push(`Complemento (texto) alterado`);
  const oldPhotos = (oldRec.compPhotos||[]).length, newPhotos = (newRec.compPhotos||[]).length;
  if (oldPhotos !== newPhotos) changes.push(`Fotos complemento: ${oldPhotos} → ${newPhotos}`);
  return changes;
}

function submitEdit() {
  const f = S.form;
  if (!f.mechanic || !f.model) { toast("Selecione o mecânico e informe o modelo.","warning"); return; }
  const orig = S.editingRecord;
  const changes = generateDiff(orig, f);
  const histEntry = {
    date: new Date().toISOString(),
    mechanic: f.mechanic,
    changes: changes.length > 0 ? changes : ["Nenhuma alteração detectada"]
  };
  const updated = {
    ...f,
    id: orig.id,
    date: orig.date,
    editHistory: [...(orig.editHistory||[]), histEntry]
  };
  saveRecord(updated);
}

function readFile(file, cb) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 1024, maxH = 1024;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.65));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}

function sc(st) { return st==="ok"?"var(--success)":st==="problema"?"var(--danger)":st==="na"?"var(--text2)":"var(--text3)"; }
function sb(st) { return st==="ok"?"var(--success-bg)":st==="problema"?"var(--danger-bg)":st==="na"?"var(--bg2)":"var(--bg)"; }
function si(st) { return st==="ok"?"✓":st==="problema"?"✕":st==="na"?"—":"○"; }
function sl(st) { return st==="ok"?"OK":st==="problema"?"Problema":st==="na"?"N/A":"—"; }

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (S.screen==="home") rHome(app);
  else if (S.screen==="new" || S.screen==="edit") { if(S.step===0) rStep0(app); else if(S.step===1) rStep1(app); else rStep2(app); }
  else if (S.screen==="records") rRecords(app);
  else if (S.screen==="detail") rDetail(app);
  else if (S.screen==="history") rHistory(app);
  else if (S.screen==="chamados") rChamados(app);
  else if (S.screen==="chamado_new") rChamadoNew(app);
  else if (S.screen==="chamado_detail") rChamadoDetail(app);
  else if (S.screen==="dashboard") rDashboard(app);
  else if (S.screen==="knowledge") rKnowledge(app);
  else if (S.screen==="knowledge_model") rKnowledgeModel(app);
  else if (S.screen==="knowledge_new") rKnowledgeNew(app);
  else if (S.screen==="admin_users") rAdminUsers(app);
  bind();
  updateBottomNav();
}

function hdr(app, title, back) {
  const w = document.createElement("div");
  w.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;">
    <button class="back-btn" data-t="${back}" style="padding:7px 9px;background:var(--bg2);border-radius:var(--radius);display:flex;align-items:center;font-size:18px;">←</button>
    <h2 style="font-size:18px;font-weight:600;">${title}</h2>
  </div>`;
  app.appendChild(w); return w;
}

// ── EVENTOS ──────────────────────────────────────────────
function bind() {
  document.querySelectorAll(".back-btn").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(t==="home") S.screen="home";
    else if(t==="records") S.screen="records";
    else if(t==="step0") { S.step=0; S.expanded={}; }
    else if(t==="step1") S.step=1;
    else if(t==="detail") S.screen="detail";
    else if(t==="chamados") S.screen="chamados";
    else if(t==="knowledge") S.screen="knowledge";
    else if(t==="knowledge_model") S.screen="knowledge_model";
    else if(t==="dashboard") S.screen="dashboard";
    else if(t==="chamado_detail") S.screen="chamado_detail";
    else if(t==="admin_users") S.screen="admin_users";
    render();
  });
  document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{
    S.screen=b.dataset.s;
    if(S.screen==="new") { S.form=nf(); S.step=0; S.expanded={}; }
    if(S.screen!=="records") S.search="";
    render();
  });
  document.querySelectorAll(".type-btn").forEach(b=>b.onclick=()=>{S.form.type=b.dataset.type;render();});
  document.querySelectorAll(".mec-btn").forEach(b=>b.onclick=()=>{S.form.mechanic=b.dataset.mec;render();});
  const im=document.getElementById("inp-model"); if(im)im.oninput=e=>S.form.model=e.target.value;
  const is=document.getElementById("inp-serial"); if(is)is.oninput=e=>S.form.serial=e.target.value;
  const bs=document.getElementById("btn-start");
  if(bs)bs.onclick=()=>{
    const f2=S.form;
    if(!f2.mechanic){toast("Selecione o mecânico responsável.","warning");return;}
    if(f2.type==="instalacao"&&!f2.linkedRecordId){toast("Vincular a uma máquina preparada é obrigatório.","warning");return;}
    if(f2.type==="instalacao"&&f2.linkedRecordId==="__manual__"&&!f2.model){toast("Informe o modelo da máquina.","warning");return;}
    if(f2.type==="envio"&&!f2.model){toast("Selecione o modelo da máquina.","warning");return;}
    if((f2.type==="envio"||(f2.type==="instalacao"&&f2.linkedRecordId==="__manual__"))&&(!f2.serial||!f2.serial.trim())){toast("O número de série é obrigatório.","warning");return;}
    S.step=1;S.expanded={};render();
  };
  document.querySelectorAll(".item-hdr").forEach(el=>el.onclick=()=>{persist();S.expanded[el.dataset.id]=!S.expanded[el.dataset.id];render();});
  document.querySelectorAll(".st-btn").forEach(b=>b.onclick=()=>{persist();S.form.items[b.dataset.id]=S.form.items[b.dataset.id]===b.dataset.val?undefined:b.dataset.val;render();});
  document.querySelectorAll(".ni").forEach(n=>n.oninput=e=>S.form.notes[n.dataset.id]=e.target.value);
  const obs=document.getElementById("obs"); if(obs)obs.oninput=e=>S.form.observation=e.target.value;
  document.querySelectorAll(".ph-add,.ph-chg").forEach(b=>b.onclick=()=>{document.querySelector(`.pi[data-id="${b.dataset.id}"]`)?.click();});
  document.querySelectorAll(".pi").forEach(inp=>inp.onchange=e=>{persist();readFile(e.target.files?.[0],data=>{S.form.photos[inp.dataset.id]=data;render();});});
  const ca=document.getElementById("comp-add"); if(ca)ca.onclick=()=>document.getElementById("comp-pi")?.click();
  // comp-pi handled separately
  document.querySelectorAll(".comp-rm").forEach(b=>b.onclick=()=>{persist();S.form.compPhotos.splice(parseInt(b.dataset.idx),1);render();});
  const cn=document.getElementById("comp-note"); if(cn)cn.oninput=e=>S.form.compNote=e.target.value;
  const bf=document.getElementById("btn-finish"); if(bf)bf.onclick=()=>{persist();S.step=2;render();};
  const bsave=document.getElementById("btn-save"); if(bsave)bsave.onclick=()=>{if(!S.saving)submitForm();};

  document.querySelectorAll(".rec-btn").forEach(b=>b.onclick=()=>{const r=S.records.find(r=>r.id===b.dataset.rid);if(r){S.selected=r;S.screen="detail";render();}});



  // PDF button
  const pdfBtn = document.querySelector(".pdf-btn");
  if(pdfBtn) pdfBtn.onclick = async () => {
    pdfBtn.textContent = "⏳ Gerando PDF...";
    pdfBtn.style.opacity = "0.7";
    pdfBtn.disabled = true;
    try {
      await generatePDF(S.selected);
    } catch(e) {
      alert("Erro ao gerar PDF. Tente novamente.");
      console.error(e);
    }
    pdfBtn.textContent = "📄 Gerar relatório PDF";
    pdfBtn.style.opacity = "1";
    pdfBtn.disabled = false;
  };

  // Edit button
  const editBtn = document.querySelector(".edit-btn");
  if(editBtn) editBtn.onclick = () => {
    if(!checkPass()) { toast("Senha incorreta.","error"); return; }
    const r = S.selected;
    S.editingRecord = JSON.parse(JSON.stringify(r));
    S.form = {
      mechanic: r.mechanic, type: r.type, model: r.model, serial: r.serial||"",
      items: {...(r.items||{})}, notes: {...(r.notes||{})}, photos: {...(r.photos||{})},
      observation: r.observation||"", compNote: r.compNote||"", compPhotos: [...(r.compPhotos||[])]
    };
    S.screen = "edit"; S.step = 0; S.expanded = {}; render();
  };

  // History button
  const histBtn = document.querySelector(".hist-btn");
  if(histBtn) histBtn.onclick = () => {
    if(!checkPass()) { toast("Senha incorreta.","error"); return; }
    S.screen = "history"; render();
  };

  // Delete button
  const delBtn = document.querySelector(".del-btn");
  if(delBtn) delBtn.onclick = async () => {
    if(!checkPass()) { toast("Senha incorreta.","error"); return; }
    if(!confirm(`Excluir o registro "${S.selected.model}"? Esta ação não pode ser desfeita.`)) return;
    try {
      await S.db.collection("checklists").doc(S.selected.id).delete();
      S.screen = "records"; S.selected = null;
      await loadRecords();
    } catch(e) { alert("Erro ao excluir. Tente novamente."); }
  };
}

// ── INIT ─────────────────────────────────────────────────
// ── GERAÇÃO DE PDF ───────────────────────────────────────
async function generatePDF(record) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const cl = CHECKLISTS[record.type];
  const pageW = 210, pageH = 297, margin = 14, contentW = pageW - margin * 2;
  let y = 0;

  const colors = {
    primary:   [24,  95, 165],
    success:   [59, 109,  17],
    successBg: [234,243,222],
    danger:    [163, 45,  45],
    dangerBg:  [252,235,235],
    warning:   [133, 79,  11],
    warningBg: [250,238,218],
    gray:      [120,120,115],
    grayBg:    [245,245,243],
    dark:      [ 26, 26, 24],
    white:     [255,255,255],
    border:    [220,220,215],
  };

  function setColor(c) { doc.setTextColor(...c); }
  function setFill(c)  { doc.setFillColor(...c); }
  function setDraw(c)  { doc.setDrawColor(...c); }

  function checkPage(needed = 10) {
    if (y + needed > pageH - 16) {
      doc.addPage();
      y = 16;
      drawPageFooter();
    }
  }

  function drawPageFooter() {
    const pg = doc.internal.getCurrentPageInfo().pageNumber;
    setColor(colors.gray);
    doc.setFontSize(8);
    doc.text(`Grupo NS Oficina · Assistência Técnica RICOMA`, margin, pageH - 8);
    doc.text(`Página ${pg}`, pageW - margin, pageH - 8, { align: 'right' });
    setDraw(colors.border);
    doc.line(margin, pageH - 12, pageW - margin, pageH - 12);
  }

  // ── HEADER ──
  setFill(colors.primary);
  doc.rect(0, 0, pageW, 42, 'F');

  // Logo area
  setColor(colors.white);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('Grupo NS Oficina', margin, 16);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text('Assistência Técnica · Máquinas RICOMA', margin, 23);

  // Report title right side
  doc.setFontSize(9);
  doc.text(cl.label.toUpperCase(), pageW - margin, 14, { align: 'right' });
  doc.setFontSize(8);
  doc.text(new Date(record.date).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' }), pageW - margin, 20, { align: 'right' });
  doc.text(new Date(record.date).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }), pageW - margin, 26, { align: 'right' });

  // Divider line in header
  doc.setLineWidth(0.3);
  setDraw([255,255,255,0.3]);
  doc.line(margin, 32, pageW - margin, 32);

  // Subtitle
  doc.setFontSize(8);
  setColor([200, 220, 245]);
  doc.text('RELATÓRIO DE VERIFICAÇÃO DE EQUIPAMENTO', margin, 38);

  y = 50;

  // ── MACHINE INFO CARD ──
  setFill(colors.grayBg);
  setDraw(colors.border);
  doc.setLineWidth(0.3);
  doc.roundedRect(margin, y, contentW, 28, 2, 2, 'FD');

  setColor(colors.gray);
  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'bold');
  doc.text('DADOS DO EQUIPAMENTO', margin + 4, y + 7);

  doc.setLineWidth(0.2);
  setDraw(colors.border);
  doc.line(margin + 4, y + 9, margin + contentW - 4, y + 9);

  const col1 = margin + 4, col2 = margin + contentW / 2 + 2;
  const di2 = record.deviceInfo || {};
  const cardH = di2.device ? 38 : 28;

  doc.setFontSize(8);
  doc.setFont('helvetica', 'bold');
  setColor(colors.dark);

  doc.text('Modelo:', col1, y + 15);
  doc.setFont('helvetica', 'normal');
  doc.text(record.model || '—', col1 + 18, y + 15);

  doc.setFont('helvetica', 'bold');
  doc.text('N° Série:', col2, y + 15);
  doc.setFont('helvetica', 'normal');
  doc.text(record.serial || '—', col2 + 20, y + 15);

  doc.setFont('helvetica', 'bold');
  doc.text('Mecânico:', col1, y + 22);
  doc.setFont('helvetica', 'normal');
  doc.text(record.mechanic || '—', col1 + 22, y + 22);

  doc.setFont('helvetica', 'bold');
  doc.text('Data:', col2, y + 22);
  doc.setFont('helvetica', 'normal');
  doc.text(new Date(record.date).toLocaleDateString('pt-BR'), col2 + 13, y + 22);

  if (di2.device) {
    setColor(colors.gray);
    doc.setFontSize(7.5);
    doc.setFont('helvetica', 'bold');
    doc.text('Assinatura digital:', col1, y + 30);
    doc.setFont('helvetica', 'normal');
    const deviceStr = (di2.device || '') + ' · ' + (di2.os || '') + ' · ' + (di2.browser || '');
    doc.text(doc.splitTextToSize(deviceStr, contentW - 38)[0], col1 + 34, y + 30);
    const gpsStr = di2.gps ? ('GPS: ' + di2.gps.lat + ', ' + di2.gps.lng + ' (±' + di2.gps.accuracy + ')') : 'GPS: não fornecido';
    doc.text(gpsStr, col1, y + 36);
  }

  y += cardH + 6;

  // ── SUMMARY BADGES ──
  const items = cl.items || [];
  const okCount    = items.filter(i => record.items?.[i.id] === 'ok').length;
  const probCount  = items.filter(i => record.items?.[i.id] === 'problema').length;
  const naCount    = items.filter(i => record.items?.[i.id] === 'na').length;
  const uncCount   = items.filter(i => !record.items?.[i.id]).length;

  const badgeW = (contentW - 9) / 4, badgeH = 16;
  const badges = [
    { label: 'OK', count: okCount, bg: colors.successBg, text: colors.success },
    { label: 'Problema', count: probCount, bg: colors.dangerBg, text: colors.danger },
    { label: 'N/A', count: naCount, bg: colors.grayBg, text: colors.gray },
    { label: 'Não verif.', count: uncCount, bg: colors.warningBg, text: colors.warning },
  ];

  badges.forEach((b, i) => {
    const bx = margin + i * (badgeW + 3);
    setFill(b.bg); setDraw(colors.border);
    doc.setLineWidth(0.3);
    doc.roundedRect(bx, y, badgeW, badgeH, 2, 2, 'FD');
    setColor(b.text);
    doc.setFontSize(7); doc.setFont('helvetica', 'normal');
    doc.text(b.label, bx + badgeW / 2, y + 5.5, { align: 'center' });
    doc.setFontSize(14); doc.setFont('helvetica', 'bold');
    doc.text(String(b.count), bx + badgeW / 2, y + 13, { align: 'center' });
  });

  y += 22;

  // ── SECTION TITLE: ITENS ──
  setFill(colors.primary);
  doc.rect(margin, y, contentW, 8, 'F');
  setColor(colors.white);
  doc.setFontSize(8); doc.setFont('helvetica', 'bold');
  doc.text('VERIFICAÇÃO DOS ITENS', margin + 4, y + 5.5);
  y += 12;

  // ── CHECKLIST ITEMS ──
  items.forEach((item, idx) => {
    const st = record.items?.[item.id];
    const note = record.notes?.[item.id];
    const hasNote = note && note.trim().length > 0;
    const rowH = hasNote ? 16 : 10;

    checkPage(rowH + 3);

    const bg = st === 'ok' ? colors.successBg : st === 'problema' ? colors.dangerBg : st === 'na' ? colors.grayBg : [255,255,255];
    const tc = st === 'ok' ? colors.success : st === 'problema' ? colors.danger : st === 'na' ? colors.gray : colors.gray;
    const statusLabel = st === 'ok' ? 'OK' : st === 'problema' ? 'PROBLEMA' : st === 'na' ? 'N/A' : '—';

    setFill(bg); setDraw(colors.border);
    doc.setLineWidth(0.2);
    doc.roundedRect(margin, y, contentW, rowH, 1, 1, 'FD');

    // Number
    setColor(colors.gray);
    doc.setFontSize(7); doc.setFont('helvetica', 'normal');
    doc.text(String(idx + 1).padStart(2, '0'), margin + 3, y + 6.5);

    // Item label
    setColor(colors.dark);
    doc.setFontSize(8.5); doc.setFont('helvetica', 'normal');
    doc.text(item.label, margin + 10, y + 6.5);

    // Status badge
    const statusW = 22;
    const stBg = st === 'ok' ? colors.success : st === 'problema' ? colors.danger : colors.gray;
    setFill(stBg);
    doc.roundedRect(margin + contentW - statusW - 2, y + 2, statusW, 6, 1, 1, 'F');
    setColor(colors.white);
    doc.setFontSize(6.5); doc.setFont('helvetica', 'bold');
    doc.text(statusLabel, margin + contentW - statusW / 2 - 2, y + 6, { align: 'center' });

    // Note
    if (hasNote) {
      setColor(colors.gray);
      doc.setFontSize(7.5); doc.setFont('helvetica', 'italic');
      const noteLines = doc.splitTextToSize(`Obs: ${note}`, contentW - 40);
      doc.text(noteLines[0], margin + 10, y + 12);
    }

    y += rowH + 1.5;
  });

  // ── OBSERVATIONS ──
  if (record.observation && record.observation.trim()) {
    checkPage(24);
    y += 4;
    setFill(colors.grayBg); setDraw(colors.border);
    doc.setLineWidth(0.3);
    const obsLines = doc.splitTextToSize(record.observation, contentW - 8);
    const obsH = 14 + obsLines.length * 5;
    doc.roundedRect(margin, y, contentW, obsH, 2, 2, 'FD');
    setColor(colors.gray);
    doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
    doc.text('OBSERVAÇÕES GERAIS', margin + 4, y + 6);
    setColor(colors.dark);
    doc.setFontSize(8.5); doc.setFont('helvetica', 'normal');
    doc.text(obsLines, margin + 4, y + 12);
    y += obsH + 4;
  }

  // ── COMPLEMENTO ──
  if (record.compNote && record.compNote.trim()) {
    checkPage(20);
    y += 2;
    setFill([255,251,235]); setDraw(colors.border);
    doc.setLineWidth(0.3);
    const compLines = doc.splitTextToSize(record.compNote, contentW - 8);
    const compH = 14 + compLines.length * 5;
    doc.roundedRect(margin, y, contentW, compH, 2, 2, 'FD');
    setColor(colors.warning);
    doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
    doc.text('COMPLEMENTO', margin + 4, y + 6);
    setColor(colors.dark);
    doc.setFontSize(8.5); doc.setFont('helvetica', 'normal');
    doc.text(compLines, margin + 4, y + 12);
    y += compH + 4;
  }

  // ── HELPER: add image preserving aspect ratio ──
  function addImageFit(dataUrl, x, maxW, maxH) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const iw = img.naturalWidth, ih = img.naturalHeight;
        let drawW = maxW, drawH = (ih / iw) * maxW;
        if (drawH > maxH) { drawH = maxH; drawW = (iw / ih) * maxH; }
        const cx = x + (maxW - drawW) / 2;
        try { doc.addImage(dataUrl, 'JPEG', cx, y, drawW, drawH, '', 'MEDIUM'); } catch(e) {}
        resolve(drawH);
      };
      img.onerror = () => resolve(0);
      img.src = dataUrl;
    });
  }

  // ── COMPLEMENT PHOTOS (2 per row) ──
  const compPhotos = record.compPhotos || [];
  if (compPhotos.length > 0) {
    checkPage(20);
    y += 2;
    setFill(colors.grayBg); setDraw(colors.border);
    doc.setLineWidth(0.3);
    doc.roundedRect(margin, y, contentW, 8, 2, 2, 'FD');
    setColor(colors.gray);
    doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
    doc.text(`FOTOS COMPLEMENTARES (${compPhotos.length})`, margin + 4, y + 5.5);
    y += 12;

    const colW = (contentW - 4) / 2;
    const maxPhotoH = 65;
    for (let i = 0; i < compPhotos.length; i += 2) {
      checkPage(maxPhotoH + 12);
      const rowStartY = y;
      let leftH = 0, rightH = 0;

      // Left photo
      try {
        const img1 = new Image();
        await new Promise(res => {
          img1.onload = () => {
            const iw=img1.naturalWidth, ih=img1.naturalHeight;
            let dw=colW, dh=(ih/iw)*colW;
            if(dh>maxPhotoH){dh=maxPhotoH;dw=(iw/ih)*maxPhotoH;}
            const cx=margin+(colW-dw)/2;
            try{doc.addImage(compPhotos[i],'JPEG',cx,rowStartY,dw,dh,'','MEDIUM');}catch(e){}
            setColor(colors.gray); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
            doc.text(`Foto ${i+1}`, margin+colW/2, rowStartY+dh+4, {align:'center'});
            leftH = dh + 6;
            res();
          };
          img1.onerror=()=>res();
          img1.src=compPhotos[i];
        });
      } catch(e){}

      // Right photo (if exists)
      if (compPhotos[i+1]) {
        try {
          const img2 = new Image();
          await new Promise(res => {
            img2.onload = () => {
              const iw=img2.naturalWidth, ih=img2.naturalHeight;
              let dw=colW, dh=(ih/iw)*colW;
              if(dh>maxPhotoH){dh=maxPhotoH;dw=(iw/ih)*maxPhotoH;}
              const rx=margin+colW+4;
              const cx=rx+(colW-dw)/2;
              try{doc.addImage(compPhotos[i+1],'JPEG',cx,rowStartY,dw,dh,'','MEDIUM');}catch(e){}
              setColor(colors.gray); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
              doc.text(`Foto ${i+2}`, rx+colW/2, rowStartY+dh+4, {align:'center'});
              rightH = dh + 6;
              res();
            };
            img2.onerror=()=>res();
            img2.src=compPhotos[i+1];
          });
        } catch(e){}
      }

      y += Math.max(leftH, rightH) + 4;
    }
  }

  // ── ITEM PHOTOS (2 per row) ──
  const itemsWithPhotos = items.filter(item => record.photos?.[item.id]);
  if (itemsWithPhotos.length > 0) {
    checkPage(20);
    y += 2;
    setFill(colors.grayBg); setDraw(colors.border);
    doc.setLineWidth(0.3);
    doc.roundedRect(margin, y, contentW, 8, 2, 2, 'FD');
    setColor(colors.gray);
    doc.setFontSize(7.5); doc.setFont('helvetica', 'bold');
    doc.text(`FOTOS DOS ITENS (${itemsWithPhotos.length})`, margin + 4, y + 5.5);
    y += 12;

    const colW2 = (contentW - 4) / 2;
    const maxItemH = 65;
    for (let i = 0; i < itemsWithPhotos.length; i += 2) {
      checkPage(maxItemH + 20);
      const rowStartY = y;
      let leftH = 0, rightH = 0;

      // Left item photo
      const item1 = itemsWithPhotos[i];
      setColor(colors.dark); doc.setFontSize(7); doc.setFont('helvetica','bold');
      const lbl1 = doc.splitTextToSize(item1.label, colW2 - 2);
      doc.text(lbl1, margin, rowStartY + 5);
      const labelH = lbl1.length * 4.5;
      try {
        const img1 = new Image();
        await new Promise(res => {
          img1.onload = () => {
            const iw=img1.naturalWidth, ih=img1.naturalHeight;
            let dw=colW2, dh=(ih/iw)*colW2;
            if(dh>maxItemH){dh=maxItemH;dw=(iw/ih)*maxItemH;}
            const cx=margin+(colW2-dw)/2;
            try{doc.addImage(record.photos[item1.id],'JPEG',cx,rowStartY+labelH+3,dw,dh,'','MEDIUM');}catch(e){}
            leftH = labelH + dh + 5;
            res();
          };
          img1.onerror=()=>res();
          img1.src=record.photos[item1.id];
        });
      } catch(e){}

      // Right item photo (if exists)
      if (itemsWithPhotos[i+1]) {
        const item2 = itemsWithPhotos[i+1];
        const rx = margin + colW2 + 4;
        setColor(colors.dark); doc.setFontSize(7); doc.setFont('helvetica','bold');
        const lbl2 = doc.splitTextToSize(item2.label, colW2 - 2);
        doc.text(lbl2, rx, rowStartY + 5);
        const labelH2 = lbl2.length * 4.5;
        try {
          const img2 = new Image();
          await new Promise(res => {
            img2.onload = () => {
              const iw=img2.naturalWidth, ih=img2.naturalHeight;
              let dw=colW2, dh=(ih/iw)*colW2;
              if(dh>maxItemH){dh=maxItemH;dw=(iw/ih)*maxItemH;}
              const cx=rx+(colW2-dw)/2;
              try{doc.addImage(record.photos[item2.id],'JPEG',cx,rowStartY+labelH2+3,dw,dh,'','MEDIUM');}catch(e){}
              rightH = labelH2 + dh + 5;
              res();
            };
            img2.onerror=()=>res();
            img2.src=record.photos[item2.id];
          });
        } catch(e){}
      }

      y += Math.max(leftH, rightH) + 6;
    }
  }

  // ── SIGNATURE AREA ──
  checkPage(36);
  y += 6;
  setDraw(colors.border);
  doc.setLineWidth(0.3);
  doc.line(margin, y + 18, margin + 70, y + 18);
  doc.line(margin + contentW - 70, y + 18, margin + contentW, y + 18);
  setColor(colors.gray);
  doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
  doc.text('Assinatura do Mecânico', margin + 35, y + 23, { align: 'center' });
  doc.text('Assinatura do Responsável', margin + contentW - 35, y + 23, { align: 'center' });
  doc.setFontSize(8); doc.setFont('helvetica', 'bold');
  setColor(colors.dark);
  doc.text(record.mechanic, margin + 35, y + 28, { align: 'center' });

  // Footer on all pages
  const totalPages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i);
    drawPageFooter();
  }

  // ── SAVE ──
  const dateStr = new Date(record.date).toLocaleDateString('pt-BR').replace(/\//g, '-');
  const modelStr = (record.model || 'maquina').replace(/\s+/g, '_');
  doc.save(`Checklist_${modelStr}_${dateStr}.pdf`);
}

function openLightbox(src, caption) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  const cap = document.getElementById("lightbox-caption");
  img.src = src;
  cap.textContent = caption || "";
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightbox-img").src = "";
  document.body.style.overflow = "";
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("lightbox-close").onclick = closeLightbox;
  document.getElementById("lightbox").onclick = e => {
    if (e.target === document.getElementById("lightbox")) closeLightbox();
  };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
});

// ── BASE DE CONHECIMENTO ─────────────────────────────────
let kbEntries = [];
async function loadKbEntries() { try { const snap=await S.db.collection("knowledge").orderBy("date","desc").get(); kbEntries=snap.docs.map(d=>({id:d.id,...d.data()})); } catch(e){kbEntries=[];} }
async function saveKbEntry(entry) { await S.db.collection("knowledge").doc(entry.id).set(entry); await loadKbEntries(); }
async function deleteKbEntry(id) { await S.db.collection("knowledge").doc(id).delete(); await loadKbEntries(); }

function rKnowledge(app) {
  const w = hdr(app, "Base de Conhecimento", "home");

  // Search filter
  const q = (S.kbSearch||"").toLowerCase().trim();
  const cat = S.kbCategory || "";
  const tag = S.kbTag || "";
  const sort = S.kbSort || "recent";

  // Filter entries
  let filtered = kbEntries.filter(e => {
    if (cat && e.category !== cat) return false;
    if (tag && !(e.tags||[]).includes(tag)) return false;
    if (q) {
      const text = (e.title+" "+(e.description||"")+" "+(e.tags||[]).join(" ")+" "+(e.model||"")+" "+(e.author||"")).toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });

  // Sort
  if (sort === "popular") {
    filtered.sort((a,b) => ((b.likes||0) + (b.views||0)*0.1) - ((a.likes||0) + (a.views||0)*0.1));
  } else if (sort === "recent") {
    filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
  } else if (sort === "alpha") {
    filtered.sort((a,b) => (a.title||"").localeCompare(b.title||""));
  }


  // All tags (deduplicated and sorted by frequency)
  const tagFreq = {};
  kbEntries.forEach(e => (e.tags||[]).forEach(t => { tagFreq[t] = (tagFreq[t]||0) + 1; }));
  const popularTags = Object.entries(tagFreq).sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);

  let html = "";

  // Search bar
  html += '<div style="position:relative;margin-bottom:14px;">';
  html += '<span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;">🔍</span>';
  html += '<input id="kb-search-input" placeholder="Buscar problemas, soluções, tags..." value="'+(S.kbSearch||"")+'" style="width:100%;padding:12px 36px 12px 38px;border-radius:var(--radius-lg);font-size:14px;" />';
  if (q) html += '<button id="kb-clear-search" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:var(--text3);padding:4px;cursor:pointer;">✕</button>';

async function incrementKbView(kbId) {
  const entry = kbEntries.find(e => e.id === kbId);
  if (!entry) return;
  entry.views = (entry.views || 0) + 1;
  try {
    await S.db.collection("knowledge").doc(kbId).update({ views: entry.views });
  } catch(e) {}
}

async function toggleKbLike(kbId) {
  if (!currentUser) return;
  const entry = kbEntries.find(e => e.id === kbId);
  if (!entry) return;
  if (!entry.likedBy) entry.likedBy = [];
  const idx = entry.likedBy.indexOf(currentUser.uid);
  if (idx >= 0) {
    entry.likedBy.splice(idx, 1);
    entry.likes = Math.max(0, (entry.likes||1) - 1);
  } else {
    entry.likedBy.push(currentUser.uid);
    entry.likes = (entry.likes||0) + 1;
  }
  try {
    await S.db.collection("knowledge").doc(kbId).update({ likes: entry.likes, likedBy: entry.likedBy });
    render();
  } catch(e) { toast("Erro ao curtir","error"); }
}

async function addKbComment(kbId, text) {
  const entry = kbEntries.find(e => e.id === kbId);
  if (!entry) return;
  if (!entry.comments) entry.comments = [];
  entry.comments.push({
    id: "cm"+Date.now(),
    author: currentUser?.name || "Anônimo",
    authorUid: currentUser?.uid,
    text: text,
    date: new Date().toISOString()
  });
  try {
    await S.db.collection("knowledge").doc(kbId).update({ comments: entry.comments });
    toast("Comentário publicado", "success");
    render();
  } catch(e) { toast("Erro ao comentar","error"); }
}

async function deleteKbComment(kbId, commentId) {
  const entry = kbEntries.find(e => e.id === kbId);
  if (!entry || !entry.comments) return;
  entry.comments = entry.comments.filter(c => c.id !== commentId);
  try {
    await S.db.collection("knowledge").doc(kbId).update({ comments: entry.comments });
    render();
  } catch(e) {}
}

async function toggleKbValidate(kbId) {
  if (!currentUser || currentUser.role !== "admin") return;
  const entry = kbEntries.find(e => e.id === kbId);
  if (!entry) return;
  entry.validated = !entry.validated;
  try {
    await S.db.collection("knowledge").doc(kbId).update({ validated: entry.validated });
    toast(entry.validated ? "Registro verificado" : "Verificação removida", "success");
    render();
  } catch(e) { toast("Erro","error"); }
}

function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

  const isEdit = !!S.kbEditingId;
  const w = hdr(app, isEdit ? "Editar Registro" : "Novo Registro", isEdit ? "knowledge_model" : "knowledge");
  const models = [...new Set([...MACHINE_MODELS.map(m=>"RICOMA "+m), ...kbEntries.map(e=>e.model)])].sort();
  const vids = f.videos || [], photos = f.photos || [], tags = f.tags || [];

  let html = '<div style="display:flex;flex-direction:column;gap:14px;">';
  if (isEdit) {
    html += '<div style="background:var(--info-bg);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:8px;"><span>✏️</span><p style="font-size:13px;color:var(--info);font-weight:500;">Modo edição — alterações salvas no histórico.</p></div>';
  }

  // Model — same styling as preparação (envio) flow
  html += '<div><span class="lbl">Modelo da máquina <span style="color:var(--danger);">*</span></span>';
  html += '<select id="kb-model-sel" style="width:100%;padding:10px 12px;border-radius:var(--radius);background:var(--bg2);border:0.5px solid var(--border);font-size:14px;color:var(--text);">';
  html += '<option value="">— Selecionar modelo —</option>';
  models.forEach(m => { html += '<option value="'+m+'"'+(f.model===m?' selected':'')+'>'+m+'</option>'; });
  html += '</select></div>';

  // Title
  html += '<div><span class="lbl">Título do problema <span style="color:var(--danger);">*</span></span><input id="kb-title" placeholder="Ex: Tensão da linha falhando..." value="'+(f.title||"")+'" style="width:100%;" /></div>';

  // Category
  html += '<div><span class="lbl">Categoria</span>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
  KB_CATEGORIES.forEach(c2 => {
    const sel = f.category === c2.id;
    html += '<button type="button" class="kb-cat-pick" data-cat="'+c2.id+'" style="padding:8px 12px;border-radius:99px;border:'+(sel?"2px solid "+c2.color:"0.5px solid var(--border)")+';background:'+(sel?"var(--bg2)":"var(--bg)")+';font-size:13px;font-weight:'+(sel?"600":"400")+';color:'+(sel?c2.color:"var(--text2)")+';cursor:pointer;">'+c2.icon+' '+c2.label+'</button>';
  });
  html += '</div></div>';

  // Difficulty
  html += '<div><span class="lbl">Dificuldade</span>';
  html += '<div style="display:flex;gap:6px;">';
  KB_DIFFICULTIES.forEach(d => {
    const sel = f.difficulty === d.id;
    html += '<button type="button" class="kb-diff-pick" data-diff="'+d.id+'" style="flex:1;padding:10px;border-radius:var(--radius);border:'+(sel?"2px solid "+d.color:"0.5px solid var(--border)")+';background:'+(sel?"var(--bg2)":"var(--bg)")+';font-size:13px;font-weight:'+(sel?"600":"400")+';color:'+(sel?d.color:"var(--text2)")+';cursor:pointer;">● '+d.label+'</button>';
  });
  html += '</div></div>';

  // Time estimate
  html += '<div><span class="lbl">Tempo estimado (minutos)</span><input id="kb-time" type="number" min="0" placeholder="Ex: 30" value="'+(f.timeEstimate||"")+'" style="width:100%;" /></div>';

  // Author (auto from currentUser, locked)
  const authorName = currentUser?.name || f.author || "—";
  html += '<div><span class="lbl">Técnico</span><div style="padding:10px 12px;background:var(--bg2);border-radius:var(--radius);border:0.5px solid var(--border);display:flex;align-items:center;gap:8px;">';
  html += '<span style="font-size:14px;">🔧</span><span style="font-size:14px;font-weight:500;">'+authorName+'</span>';
  html += '<span style="margin-left:auto;font-size:10px;color:var(--text3);">🔒 Identificação automática</span></div></div>';

  // Description (with formatting hints)
  html += '<div><span class="lbl">Descrição e solução <span style="color:var(--danger);">*</span></span>';
  html += '<p style="font-size:11px;color:var(--text3);margin-bottom:6px;">Formatação: **negrito**, *itálico*, `código`</p>';
  html += '<textarea id="kb-desc" placeholder="Descreva o problema e como foi resolvido passo a passo..." style="width:100%;min-height:160px;font-size:14px;">'+(f.description||"")+'</textarea></div>';

  // Photos
  html += '<div><span class="lbl">Fotos</span>';
  if (photos.length > 0) {
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">';
    photos.forEach((p,i) => { html += '<div style="position:relative;width:calc(33.33% - 6px);aspect-ratio:1;"><img src="'+p+'" onclick="openLightbox(this.src,\'Foto \'+(i+1))" style="width:100%;height:100%;border-radius:8px;object-fit:cover;cursor:zoom-in;" /><button class="kb-rm-photo" data-idx="'+i+'" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);border:none;color:#fff;font-size:12px;cursor:pointer;">✕</button></div>'; });
    html += '</div>';
  }
  html += '<input type="file" id="kb-photo-input" accept="image/*" multiple style="display:none;" />';
  html += '<button id="kb-add-photo" style="width:100%;padding:10px;border-radius:var(--radius);border:0.5px dashed var(--border);background:transparent;font-size:13px;color:var(--text2);cursor:pointer;">📷 Foto'+(photos.length>0?" ("+photos.length+")":"")+'</button></div>';

  // Videos
  html += '<div><span class="lbl">Links / Vídeos</span>';
  vids.forEach((v,i) => { html += '<div style="display:flex;gap:8px;margin-bottom:8px;"><div style="flex:1;"><input class="kb-vid-title" data-idx="'+i+'" placeholder="Título do link" value="'+(v.title||"")+'" style="width:100%;margin-bottom:4px;" /><input class="kb-vid-url" data-idx="'+i+'" placeholder="www.exemplo.com ou https://..." value="'+(v.url||"")+'" style="width:100%;" /></div><button class="kb-rm-vid" data-idx="'+i+'" style="padding:6px 10px;border-radius:var(--radius);background:var(--danger-bg);border:none;color:var(--danger);font-size:12px;cursor:pointer;height:fit-content;margin-top:4px;">✕</button></div>'; });
  html += '<button id="kb-add-vid" style="width:100%;padding:10px;border-radius:var(--radius);border:0.5px dashed var(--border);background:transparent;font-size:13px;color:var(--text2);cursor:pointer;">🔗 Adicionar link</button></div>';

  // Deleted photos (in edit mode)
  if ((f.deletedPhotos||[]).length > 0) {
    html += '<div><details style="border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;"><summary style="font-size:13px;color:var(--text2);cursor:pointer;font-weight:500;">🗑️ Fotos removidas ('+f.deletedPhotos.length+')</summary>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">';
    f.deletedPhotos.forEach((dp,i) => {
      const src = typeof dp === "string" ? dp : dp.src;
      html += '<img src="'+src+'" onclick="openLightbox(this.src,\'Foto removida \'+(i+1))" style="width:calc(33.33% - 6px);aspect-ratio:1;border-radius:8px;object-fit:cover;cursor:zoom-in;opacity:0.6;border:2px dashed var(--danger);" />';
    });
    html += '</div></details></div>';
  }

  html += '<button id="kb-submit" style="padding:14px;border-radius:var(--radius);background:'+(isEdit?"var(--info-bg)":"var(--warning-bg)")+';border:none;color:'+(isEdit?"var(--info)":"var(--warning)")+';font-weight:600;font-size:15px;width:100%;cursor:pointer;">'+(isEdit?"💾 Salvar alterações":"Salvar registro →")+'</button></div>';

  w.insertAdjacentHTML("beforeend", html);

  // Bindings
  document.getElementById("kb-model-sel").onchange = e => { S.kbForm.model = e.target.value; };
  document.getElementById("kb-title").oninput = e => { S.kbForm.title = e.target.value; };
  document.getElementById("kb-desc").oninput = e => { S.kbForm.description = e.target.value; };
  document.getElementById("kb-time").oninput = e => { S.kbForm.timeEstimate = e.target.value; };

  document.querySelectorAll(".kb-cat-pick").forEach(b => b.onclick = () => { S.kbForm.category = (S.kbForm.category === b.dataset.cat) ? "" : b.dataset.cat; render(); });
  document.querySelectorAll(".kb-diff-pick").forEach(b => b.onclick = () => { S.kbForm.difficulty = (S.kbForm.difficulty === b.dataset.diff) ? "" : b.dataset.diff; render(); });

  // Photos
  document.getElementById("kb-add-photo").onclick = () => document.getElementById("kb-photo-input").click();
  const kbPi = document.getElementById("kb-photo-input");
  if (kbPi) kbPi.onchange = e => {
    const files = Array.from(e.target.files||[]); if (!files.length) return;
    if (!S.kbForm.photos) S.kbForm.photos = [];
    let done = 0;
    files.forEach(file => { const reader = new FileReader(); reader.onload = ev => { const img = new Image(); img.onload = () => { const canvas = document.createElement("canvas"); let w2=img.width,h2=img.height,max=1024; if(w2>max){h2=Math.round(h2*max/w2);w2=max;} if(h2>max){w2=Math.round(w2*max/h2);h2=max;} canvas.width=w2;canvas.height=h2;canvas.getContext("2d").drawImage(img,0,0,w2,h2); S.kbForm.photos.push(canvas.toDataURL("image/jpeg",0.7)); done++; if(done===files.length)render(); }; img.src=ev.target.result; }; reader.readAsDataURL(file); });
    e.target.value = "";
  };
  document.querySelectorAll(".kb-rm-photo").forEach(b => b.onclick = () => {
    const idx2 = parseInt(b.dataset.idx);
    const removed = S.kbForm.photos.splice(idx2, 1)[0];
    if (removed) { if (!S.kbForm.deletedPhotos) S.kbForm.deletedPhotos = []; S.kbForm.deletedPhotos.push({ src: removed, removedAt: new Date().toISOString() }); }
    render();
  });

  // Videos
  document.getElementById("kb-add-vid").onclick = () => { if(!S.kbForm.videos)S.kbForm.videos=[]; S.kbForm.videos.push({title:"",url:""}); render(); };
  document.querySelectorAll(".kb-vid-title").forEach(b => b.oninput = e => { if(!S.kbForm.videos)S.kbForm.videos=[]; S.kbForm.videos[parseInt(b.dataset.idx)].title=e.target.value; });
  document.querySelectorAll(".kb-vid-url").forEach(b => b.oninput = e => { if(!S.kbForm.videos)S.kbForm.videos=[]; S.kbForm.videos[parseInt(b.dataset.idx)].url=e.target.value; });
  document.querySelectorAll(".kb-rm-vid").forEach(b => b.onclick = () => { S.kbForm.videos.splice(parseInt(b.dataset.idx),1); render(); });

  document.getElementById("kb-submit").onclick = async () => {
    const f2 = S.kbForm;
    if (!f2.model) { toast("Selecione o modelo","warning"); return; }
    if (!f2.title?.trim()) { toast("Informe o título","warning"); return; }
    if (!f2.description?.trim()) { toast("Informe a descrição","warning"); return; }
    const btn = document.getElementById("kb-submit");
    btn.textContent = "Salvando..."; btn.disabled = true;
    try {
      if (isEdit) {
        const original = kbEntries.find(e => e.id === S.kbEditingId) || {};
        const changes = [];
        if (original.title !== f2.title) changes.push('Título alterado');
        if (original.description !== f2.description) changes.push('Descrição alterada');
        if (original.category !== f2.category) changes.push('Categoria alterada');
        if (original.difficulty !== f2.difficulty) changes.push('Dificuldade alterada');
        if ((original.photos||[]).length !== (f2.photos||[]).length) changes.push('Fotos: '+(original.photos||[]).length+' → '+(f2.photos||[]).length);
        if ((original.videos||[]).length !== (f2.videos||[]).length) changes.push('Links alterados');
        if (original.model !== f2.model) changes.push('Modelo: '+f2.model);
        if (original.timeEstimate !== f2.timeEstimate) changes.push('Tempo alterado');
        const editHistory = [...(original.editHistory||[]), {
          date: new Date().toISOString(),
          editedBy: currentUser?.name || f2.author || "Desconhecido",
          changes: changes.length > 0 ? changes : ["Registro atualizado"]
        }];
        const updated = { ...f2, editHistory, videos: (f2.videos||[]).filter(v=>v.url.trim()),
          deletedPhotos: f2.deletedPhotos || [] };
        await saveKbEntry(updated);
        toast("Alterações salvas","success");
      } else {
        const entry = {
          id: "kb"+Date.now(),
          date: new Date().toISOString(),
          model: f2.model, title: f2.title.trim(),
          author: currentUser?.name || "—",
          authorUid: currentUser?.uid || null,
          description: f2.description || "",
          category: f2.category || "outros",
          difficulty: f2.difficulty || "media",
          timeEstimate: f2.timeEstimate ? parseInt(f2.timeEstimate) : null,
          photos: f2.photos || [],
          videos: (f2.videos||[]).filter(v=>v.url.trim()),
          editHistory: [],
          likes: 0, likedBy: [], views: 0, comments: [],
          validated: false
        };
        await saveKbEntry(entry);
        toast("Registro criado","success");
      }
      S.kbModel = S.kbForm.model;
      S.kbExpanded = {};
      S.kbEditingId = null;
      S.screen = "knowledge_model";
      S.kbForm = {};
      render();
    } catch(e) {
      toast("Erro ao salvar","error");
      btn.textContent = isEdit ? "💾 Salvar alterações" : "Salvar →";
      btn.disabled = false;
    }
  };
}

// ── CHAMADOS ─────────────────────────────────────────────
let chamados = [];
async function loadChamados() { try { const snap=await S.db.collection("chamados").orderBy("date","desc").get(); chamados=snap.docs.map(d=>({id:d.id,...d.data()})); } catch(e){chamados=[];} }
async function saveChamado(ch) { await S.db.collection("chamados").doc(ch.id).set(ch); await loadChamados(); }
async function openNewChamado(data) {
  S.saving=true;render();
  try{
    const linkedPrep=data.serial?S.records.find(r=>r.type==="envio"&&r.serial&&r.serial.trim().toLowerCase()===data.serial.trim().toLowerCase()):null;
    const linkedInstal=data.serial?S.records.find(r=>r.type==="instalacao"&&r.serial&&r.serial.trim().toLowerCase()===data.serial.trim().toLowerCase()):null;
    const linkedProtocol=linkedInstal?.protocol||linkedPrep?.protocol||null;
    const ch={id:"ch"+Date.now(),date:new Date().toISOString(),status:"aberto",model:data.model,serial:data.serial,mechanic:data.mechanic,description:data.description,photos:data.photos||[],replies:[],linkedPrepId:linkedPrep?.id||null,linkedInstalId:linkedInstal?.id||null,linkedProtocol};
    await saveChamado(ch);S.selectedChamado=chamados.find(c=>c.id===ch.id);S.screen="chamado_detail";S.saving=false;render();
  }catch(e){S.saving=false;toast("Erro ao abrir chamado.","error");render();}
}
async function addReply(chamadoId,reply) {
  const ch=chamados.find(c=>c.id===chamadoId);if(!ch)return;
  ch.replies=ch.replies||[];ch.replies.push(reply);
  if(ch.status==="aberto"&&reply.isFactory)ch.status="andamento";
  if(reply.reopen)ch.status="aberto";
  await saveChamado(ch);S.selectedChamado=chamados.find(c=>c.id===ch.id);render();
}
async function setChamadoStatus(chamadoId,status) {
  const ch=chamados.find(c=>c.id===chamadoId);if(!ch)return;
  ch.status=status;await saveChamado(ch);S.selectedChamado=chamados.find(c=>c.id===ch.id);render();
}
function statusStyle(st) {
  if(st==="aberto")return{bg:"var(--danger-bg)",text:"var(--danger)",label:"● ABERTO"};
  if(st==="andamento")return{bg:"var(--warning-bg)",text:"var(--warning)",label:"● EM ANDAMENTO"};
  if(st==="resolvido")return{bg:"var(--success-bg)",text:"var(--success)",label:"✓ RESOLVIDO"};
  return{bg:"var(--bg2)",text:"var(--text2)",label:st};
}

function rChamados(app) {
  const q=(S.chamadoSearch||"").toLowerCase().trim();
  const filtered=q?chamados.filter(ch=>(ch.model||"").toLowerCase().includes(q)||(ch.serial||"").toLowerCase().includes(q)||(ch.mechanic||"").toLowerCase().includes(q)||(ch.description||"").toLowerCase().includes(q)||(ch.replies||[]).some(r=>(r.text||"").toLowerCase().includes(q))):chamados;
  let html='';
  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;"><button id="btn-back-chamados" style="padding:7px 9px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;font-size:18px;flex-shrink:0;">←</button><div><p style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:2px;">RICOMA · Assistência Técnica</p><h1 style="font-size:20px;font-weight:700;">Histórico de Problemas</h1></div></div>';
  html+='<div style="position:relative;margin-bottom:10px;"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;">🔍</span><input id="chamado-search" placeholder="Buscar por modelo, série, técnico, descrição..." style="width:100%;padding:10px 36px 10px 36px;border-radius:var(--radius-lg);font-size:14px;" /><button id="chamado-search-clear" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:var(--text3);padding:4px;cursor:pointer;display:none;">✕</button></div>';
  const total=chamados.length,abertos=chamados.filter(c=>c.status==="aberto").length,andamento=chamados.filter(c=>c.status==="andamento").length;
  html+='<div style="display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;">';
  html+='<div style="flex-shrink:0;background:var(--bg2);border-radius:var(--radius);padding:8px 14px;text-align:center;min-width:60px;"><p style="font-size:18px;font-weight:700;">'+total+'</p><p style="font-size:10px;color:var(--text3);">Total</p></div>';
  html+='<div style="flex-shrink:0;background:var(--danger-bg);border-radius:var(--radius);padding:8px 14px;text-align:center;min-width:60px;"><p style="font-size:18px;font-weight:700;color:var(--danger);">'+abertos+'</p><p style="font-size:10px;color:var(--danger);">Abertos</p></div>';
  html+='<div style="flex-shrink:0;background:var(--warning-bg);border-radius:var(--radius);padding:8px 14px;text-align:center;min-width:60px;"><p style="font-size:18px;font-weight:700;color:var(--warning);">'+andamento+'</p><p style="font-size:10px;color:var(--warning);">Em andamento</p></div></div>';
  html+='<button id="btn-new-chamado" style="width:100%;padding:13px;border-radius:var(--radius-lg);background:var(--danger-bg);border:0.5px solid var(--danger);color:var(--danger);font-weight:600;font-size:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;">＋ Abrir novo chamado</button>';
  if(q)html+='<p style="font-size:12px;color:var(--text3);margin-bottom:8px;">'+filtered.length+' resultado'+(filtered.length!==1?'s':'')+' para "'+S.chamadoSearch+'"</p>';
  html+='<div id="chamado-list">';
  if(!filtered.length){html+='<div style="text-align:center;padding:3rem 1rem;color:var(--text2);"><p style="font-size:32px;margin-bottom:12px;">📭</p>'+(q?'<p>Nenhum chamado encontrado.</p>':'<p>Nenhum chamado registrado ainda.</p>')+'</div>';}
  else{filtered.forEach(ch=>{const st=statusStyle(ch.status);const rc=(ch.replies||[]).length;html+='<button class="chamado-btn" data-cid="'+ch.id+'" style="width:100%;text-align:left;padding:14px;border-radius:var(--radius-lg);background:var(--bg);border:0.5px solid var(--border);margin-bottom:8px;cursor:pointer;"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;"><div style="flex:1;margin-right:8px;"><p style="font-weight:700;font-size:14px;">'+ch.model+'</p>'+(ch.serial?'<p style="font-size:12px;color:var(--text3);margin-top:1px;">S/N: '+ch.serial+'</p>':'')+'</div><span style="font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:'+st.bg+';color:'+st.text+';white-space:nowrap;">'+st.label+'</span></div><p style="font-size:13px;color:var(--text2);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">'+ch.description+'</p><div style="display:flex;justify-content:space-between;align-items:center;"><p style="font-size:11px;color:var(--text3);">👤 '+ch.mechanic+' · '+new Date(ch.date).toLocaleDateString("pt-BR")+'</p>'+(rc>0?'<span style="font-size:11px;color:var(--text3);">💬 '+rc+' resposta'+(rc>1?'s':'')+'</span>':'')+'</div></button>';});}
  html+='</div>';
  app.innerHTML=html;
  const inp=document.getElementById("chamado-search");
  if(inp){inp.value=S.chamadoSearch||"";inp.oninput=e=>{S.chamadoSearch=e.target.value;const clr=document.getElementById("chamado-search-clear");if(clr)clr.style.display=e.target.value?"block":"none";updateChamadoList();};}
  document.getElementById("chamado-search-clear").onclick=()=>{S.chamadoSearch="";if(inp){inp.value="";inp.focus();}document.getElementById("chamado-search-clear").style.display="none";updateChamadoList();};
  document.getElementById("btn-back-chamados").onclick=()=>{S.screen="home";render();};
  document.getElementById("btn-new-chamado").onclick=()=>{S.screen="chamado_new";S.chamadoForm={};render();};
  bindChamadoList();
}

function updateChamadoList() {
  const el=document.getElementById("chamado-list");if(!el)return;
  const q=(S.chamadoSearch||"").toLowerCase().trim();
  const filtered=q?chamados.filter(ch=>(ch.model||"").toLowerCase().includes(q)||(ch.serial||"").toLowerCase().includes(q)||(ch.mechanic||"").toLowerCase().includes(q)||(ch.description||"").toLowerCase().includes(q)||(ch.replies||[]).some(r=>(r.text||"").toLowerCase().includes(q))):chamados;
  let html='';

      authorUid: currentUser.uid,

// ── VIDEO RENDERING & LIGHTBOX ────────────────────────────
function parseVideoUrl(url) {
  if (!url) return null;
  url = url.trim();
  // YouTube patterns
  const ytMatch = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (ytMatch) return { type: "youtube", id: ytMatch[1], embedUrl: "https://www.youtube.com/embed/"+ytMatch[1]+"?autoplay=1&rel=0" };
  // Google Drive
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return { type: "drive", id: driveMatch[1], embedUrl: "https://drive.google.com/file/d/"+driveMatch[1]+"/preview" };
  // Vimeo
  const vmMatch = url.match(/vimeo\.com\/(\d+)/);
  if (vmMatch) return { type: "vimeo", id: vmMatch[1], embedUrl: "https://player.vimeo.com/video/"+vmMatch[1]+"?autoplay=1" };
  // Direct video file
  if (/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url)) return { type: "direct", embedUrl: url };
  return null;
}

function generateProtocol(type) {
  if (type !== "instalacao") return null;
  const existing = S.records.filter(r => r.type === "instalacao" && r.protocol).length;
  return "OS-" + String(existing + 1).padStart(3, "0");
}

function getBlockedSerials() {
  const linked = new Set();
  S.records.forEach(r => {
    if (r.type === "instalacao") {
      if (r.serial) linked.add(r.serial.trim().toLowerCase());
      if (r.linkedRecordId) {
        const prep = S.records.find(p => p.id === r.linkedRecordId);
        if (prep && prep.serial) linked.add(prep.serial.trim().toLowerCase());
      }
    }
  });
  return linked;
}

function getInstalacaoForSerial(serial) {
  if (!serial || !serial.trim()) return null;
  const s = serial.trim().toLowerCase();
  return S.records.find(r => {
    if (r.type !== "instalacao") return false;
    if (r.serial && r.serial.trim().toLowerCase() === s) return true;
    if (r.linkedRecordId) {
      const prep = S.records.find(p => p.id === r.linkedRecordId);
      return prep && prep.serial && prep.serial.trim().toLowerCase() === s;
    }
    return false;
  });
}

function getExistingPrep(serial) {
  if (!serial || !serial.trim()) return null;
  const s = serial.trim().toLowerCase();
  return S.records.find(r => r.type === "envio" && r.serial && r.serial.trim().toLowerCase() === s);
}

function isSerialDuplicatePrep(serial, currentId) {
  if (!serial || !serial.trim()) return false;
  const s = serial.trim().toLowerCase();
  return S.records.some(r => r.type === "envio" && r.serial && r.serial.trim().toLowerCase() === s && r.id !== currentId);
}

function openSignaturePad() {
  const modal=document.getElementById("sig-modal"); if(!modal){toast("Erro: modal não encontrado.","error");return;}
  modal.style.display="flex"; document.body.style.overflow="hidden"; sigHasMark=false;
  setTimeout(()=>{
    const canvas=document.getElementById("sig-canvas"); const container=canvas.parentElement;
    const dpr=window.devicePixelRatio||1, w=container.clientWidth, h=container.clientHeight;
    canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+"px"; canvas.style.height=h+"px";
    sigCtx=canvas.getContext("2d"); sigCtx.scale(dpr,dpr);
    sigCtx.strokeStyle="#111"; sigCtx.lineWidth=2.5; sigCtx.lineCap="round"; sigCtx.lineJoin="round";
    function getXY(e) { const r=canvas.getBoundingClientRect(); const src=e.touches?e.touches[0]:e; return {x:src.clientX-r.left,y:src.clientY-r.top}; }
    canvas.onpointerdown=e=>{ e.preventDefault(); sigDrawing=true; const p=getXY(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); const h2=document.getElementById("sig-hint"); if(h2)h2.style.display="none"; try{canvas.setPointerCapture(e.pointerId);}catch{} };
    canvas.onpointermove=e=>{ e.preventDefault(); if(!sigDrawing)return; const p=getXY(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); sigHasMark=true; };
    canvas.onpointerup=e=>{ e.preventDefault(); sigDrawing=false; sigCtx.beginPath(); };
    document.getElementById("sig-clear").onclick=()=>{ sigCtx.clearRect(0,0,w,h); sigHasMark=false; const h2=document.getElementById("sig-hint"); if(h2)h2.style.display="block"; };
    document.getElementById("sig-save").onclick=()=>{ if(!sigHasMark){toast("Assine antes de confirmar.","warning");return;} const off=document.createElement("canvas"); off.width=canvas.width; off.height=canvas.height; const offCtx=off.getContext("2d"); offCtx.fillStyle="#ffffff"; offCtx.fillRect(0,0,off.width,off.height); offCtx.drawImage(canvas,0,0); persist(); S.form.clientSignature=off.toDataURL("image/jpeg",0.85); closeSignaturePad(); render(); };
    document.getElementById("sig-cancel").onclick=closeSignaturePad;
  },100);
}
function closeSignaturePad() { const m=document.getElementById("sig-modal"); if(m)m.style.display="none"; document.body.style.overflow=""; }




function ensureUrl(url) {
  if (!url) return '#';
  url = url.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}


// ── TOAST NOTIFICATIONS ──────────────────────────────────
function toast(message, type) {
  type = type || "info";
  const container = document.getElementById("toast-container");
  if (!container) return;
  const colors = {
    success: { bg:"var(--success-bg)", border:"var(--success)", icon:"✓" },
    error:   { bg:"var(--danger-bg)",  border:"var(--danger)",  icon:"✕" },
    warning: { bg:"var(--warning-bg)", border:"var(--warning)", icon:"⚠" },
    info:    { bg:"var(--info-bg)",    border:"var(--info)",    icon:"ℹ" }
  };
  const c2 = colors[type] || colors.info;
  const el = document.createElement("div");
  el.style.cssText = `pointer-events:auto;background:${c2.bg};border:1px solid ${c2.border};border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.15);transform:translateY(-20px);opacity:0;transition:all 0.25s cubic-bezier(0.22,1,0.36,1);font-size:14px;color:${c2.border};font-weight:500;`;
  el.innerHTML = '<span style="font-size:18px;font-weight:700;">'+c2.icon+'</span><span style="flex:1;">'+message+'</span>';
  container.appendChild(el);
  requestAnimationFrame(() => { el.style.transform="translateY(0)"; el.style.opacity="1"; });
  setTimeout(() => {
    el.style.transform="translateY(-20px)"; el.style.opacity="0";
    setTimeout(() => { try { container.removeChild(el); } catch(e) {} }, 250);
  }, type === "error" ? 5000 : 3000);
}
